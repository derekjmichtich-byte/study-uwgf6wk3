:root{--blue:#2a6fb0;--green:#2e8b57;--orange:#d9822b;--purple:#7b4fa3;--teal:#16867f;--red:#d64545}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:"Andika","Trebuchet MS","Segoe UI",system-ui,sans-serif;background:linear-gradient(160deg,#dff0ff,#fdf3e1);color:#1d2a3a;min-height:100vh;font-size:24px;line-height:1.35;overflow-x:hidden}
header{background:var(--blue);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 3px 8px rgba(0,0,0,.15);position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:24px;flex:1;min-width:200px}
.pill{background:rgba(255,255,255,.22);border-radius:999px;padding:6px 14px;font-weight:bold;font-size:18px;white-space:nowrap}
.wrap{max-width:940px;margin:0 auto;padding:14px}
button{font:inherit;cursor:pointer;border:none;border-radius:16px;touch-action:manipulation;color:#fff;font-weight:bold;box-shadow:0 4px 0 rgba(0,0,0,.18)}
button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
button:disabled{opacity:.45;cursor:default;transform:none}
.big{font-size:24px;padding:12px 22px;min-height:60px}
.blue{background:var(--blue)}.green{background:var(--green)}.orange{background:var(--orange)}.purple{background:var(--purple)}.teal{background:var(--teal)}.gray{background:#7a8899}.red{background:var(--red)}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:10px}
.menu button{font-size:28px;min-height:140px;padding:16px;line-height:1.2;text-align:center}
.menu button small{display:block;font-size:17px;font-weight:normal;margin-top:8px;opacity:.95}
.card{background:#fff;border-radius:22px;padding:20px 22px;box-shadow:0 6px 18px rgba(30,60,100,.13);text-align:center;position:relative}
.card h2{margin:6px 0 10px;font-size:28px}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:14px 0;align-items:center}
.factors{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0}
.factors button{min-width:64px;min-height:64px;font-size:26px;border-radius:14px}
.factors button.on{outline:4px solid #fff;box-shadow:0 0 0 4px var(--blue),0 4px 0 rgba(0,0,0,.18)}
.qtext{font-size:56px;font-weight:bold;margin:18px 0 10px;letter-spacing:1px}
.sub{font-size:20px;color:#5b6b7d;margin:4px 0 10px}
input.ans{font:inherit;font-size:48px;text-align:center;width:min(280px,70vw);padding:8px 14px;border:4px solid #9bb7d4;border-radius:18px;background:#fbfdff;color:#123}
input.ans:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 5px rgba(42,111,176,.2)}
input.ans.ok{border-color:var(--green);background:#e9f8ef}
input.ans.bad{border-color:var(--red);background:#fdeeee}
.msg{min-height:64px;font-size:24px;margin-top:8px}
.right{color:var(--green);font-weight:bold}
.wrong{color:var(--red);font-weight:bold}
.hintbox{background:#fff6d9;border:3px dashed var(--orange);border-radius:16px;padding:12px 16px;margin:10px auto;max-width:560px;font-size:20px;text-align:left;display:none}
.hintbox.show{display:block}
.prog{font-size:20px;color:#667}
.end .score{font-size:72px;font-weight:bold;color:var(--green)}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0}
.chip{background:#fdeeee;border:2px solid var(--red);border-radius:999px;padding:4px 16px;font-size:22px}
.timer{font-size:42px;font-weight:bold;color:var(--orange);min-height:50px}
.pb{font-size:20px;color:var(--purple);font-weight:bold}
.choices{display:flex;flex-direction:column;gap:12px;max-width:520px;margin:12px auto;text-align:left}
.choices button{background:#eef3fa;color:#123;border:3px solid #9bb7d4;font-size:26px;padding:14px 18px;text-align:left;box-shadow:none}
.choices button.sel{background:#dbe9ff;border-color:var(--blue)}
.choices button.ok{background:#e9f8ef;border-color:var(--green)}
.choices button.bad{background:#fdeeee;border-color:var(--red)}
.fam{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:16px 0;font-size:40px;font-weight:bold}
.fam span{background:#f3ecfb;border:3px solid var(--purple);border-radius:18px;padding:10px 22px;min-width:80px}
.conf{position:fixed;top:-20px;width:12px;height:18px;z-index:60;pointer-events:none;border-radius:3px;animation:fall 1.6s ease-in forwards}
.conf.star{width:auto;height:auto;background:none!important;font-size:30px}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(var(--dx),105vh) rotate(720deg);opacity:.7}}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.1)}100%{transform:scale(1)}}
.note{font-size:17px;color:#5b6b7d;margin-top:10px}
.speak{background:var(--purple);font-size:20px;padding:10px 18px;min-height:50px}
.progress{height:14px;background:#cfe0f2;border-radius:10px;overflow:hidden;margin:4px 0 12px}
.progress div{height:100%;background:linear-gradient(90deg,#33b36b,#7bd88f);width:0;transition:width .3s}
@media (max-width:600px){.qtext{font-size:42px}input.ans{font-size:36px}.menu button{font-size:24px;min-height:120px}}
</style>
</head>

<script>// ---- Natural voice: pre-recorded neural-TTS clips embedded in this file (works offline). ----
// window.__CLIPS = {key: "data:audio/mpeg;base64,..."}; window.__CLIPTEXT = {key: [text, isSlow]}
// The browser's speechSynthesis is used ONLY as a fallback if a clip is missing or fails to play.
var Voice=(function(){
  "use strict";
  var CL=window.__CLIPS||{},TX=window.__CLIPTEXT||{},log=window.__voiceLog=[];
  var player=new Audio();player.preload="auto";player.id="voicePlayer";
  var queue=[],token=0,timer=null;
  var synth=window.speechSynthesis||null,sv=null;
  function pickVoice(){
    if(!synth) return;var vs=synth.getVoices()||[],pref=["Samantha","Google US English","Microsoft Aria","Microsoft Jenny","Microsoft Zira"];
    for(var p=0;p<pref.length;p++) for(var i=0;i<vs.length;i++) if(vs[i].name.indexOf(pref[p])>=0){sv=vs[i];return;}
    for(i=0;i<vs.length;i++) if(/^en[-_]US/i.test(vs[i].lang)){sv=vs[i];return;}
  }
  if(synth){try{pickVoice();if("onvoiceschanged" in synth) synth.onvoiceschanged=pickVoice;}catch(e){}}
  function fallback(k,done){
    var t=TX[k];log.push("fallback:"+k);
    if(!synth||!t){done();return;}
    try{var u=new SpeechSynthesisUtterance(t[0]);u.lang="en-US";if(sv)u.voice=sv;u.rate=t[1]?0.6:0.85;
      u.onend=done;u.onerror=done;synth.speak(u);}catch(e){done();}
  }
  function stop(){
    token++;queue=[];clearTimeout(timer);
    try{player.pause();}catch(e){}
    if(synth){try{synth.cancel();}catch(e){}}
  }
  // items: array of clip keys, or {k:key,gap:ms-of-silence-after}
  function play(items){
    stop();var my=token;
    queue=[].concat(items).map(function(x){return typeof x==="string"?{k:x,gap:0}:x;});
    next(my);
  }
  function next(my){
    if(my!==token) return;
    var it=queue.shift();if(!it) return;
    var finished=false;
    function done(){if(finished||my!==token) return;finished=true;timer=setTimeout(function(){next(my);},it.gap||0);}
    var failed=false;
    function fail(why){if(failed||finished||my!==token) return;failed=true;log.push(why+":"+it.k);fallback(it.k,done);}
    var src=CL[it.k];
    if(!src){fail("missing");return;}
    player.onended=function(){log.push("ended:"+it.k);done();};
    player.onerror=function(){fail("error");};
    player.src=src;log.push("play:"+it.k);
    try{var pr=player.play();if(pr&&pr.catch) pr.catch(function(e){fail("blocked("+(e&&e.name)+")");});}
    catch(e){fail("exception");}
  }
  return {play:play,stop:stop,has:function(k){return !!CL[k];},count:Object.keys(CL).length,
          canTalk:Object.keys(CL).length>0||!!synth,player:player};
})();

  function uid(){return Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,10);}
  function loadQ(){try{var q=JSON.parse(localStorage.getItem(QKEY)||"[]");return Array.isArray(q)?q:[];}catch(e){return [];}}
  function saveQ(q){try{q=q.slice(-MAXQ);if(q.length)localStorage.setItem(QKEY,JSON.stringify(q));else localStorage.removeItem(QKEY);}catch(e){}}
  function qid(p){return p.sessionId+":"+p.status;}
  function enqueue(p){var q=loadQ().filter(function(x){return x&&!(x.sessionId===p.sessionId&&(qid(x)===qid(p)||p.status==="complete"));});q.push(p);saveQ(q);log.push("queued:"+qid(p));}
  function dequeue(p){saveQ(loadQ().filter(function(x){return x&&qid(x)!==qid(p);}));}
  function device(){
    var u=navigator.userAgent||"",d=/iPad/.test(u)||(/Macintosh/.test(u)&&navigator.maxTouchPoints>1)?"iPad":/iPhone/.test(u)?"iPhone":
      /Android/.test(u)?"Android":/CrOS/.test(u)?"Chromebook":/Windows/.test(u)?"Windows":/Macintosh/.test(u)?"Mac":/Linux/.test(u)?"Linux":"other";
    var b=/Edg\//.test(u)?"Edge":/CriOS|Chrome\//.test(u)?"Chrome":/FxiOS|Firefox\//.test(u)?"Firefox":/Safari\//.test(u)?"Safari":"";
    return d+(b?" "+b:"")+" "+(window.screen?screen.width+"x"+screen.height:"");
  }
  function newSession(o){
    o=o||{};
    return {id:uid(),mode:clip(o.mode||"Practice",80),round:Math.max(1,Math.round(+o.round)||1),
      total:o.total==null?null:Math.max(0,Math.round(+o.total)||0),t0:Date.now(),answers:[],keys:{},done:false,sentIncomplete:"",leaves:[],away:null};
  }
  // payload sent to Code.gs (status "complete" or "incomplete")
  function payload(status,r){
    var now=new Date(),a=S.answers.slice(0,MAXANS),right=S.answers.filter(function(x){return x.ok;}).length;
    var p={v:2,token:CFG.token||"",sessionId:S.id,status:status,kid:meta.kid,topic:meta.topic,title:meta.title,subject:meta.subject,
      page:meta.page,mode:S.mode,round:S.round,total:S.total,answered:S.answers.length,
      score:right,startedAt:new Date(S.t0).toISOString(),answers:a,missed:[],finishedAt:now.toISOString(),device:device()};
    if(r){ // the page's own end-screen numbers are authoritative for a complete session
      p.mode=clip(r.mode||S.mode,80);p.round=Math.max(1,Math.round(+r.round)||S.round);
      p.score=Math.max(0,Math.round(+r.score)||0);p.total=r.total==null?null:Math.max(0,Math.round(+r.total)||0);
      if(r.startedAt) p.startedAt=new Date(r.startedAt).toISOString();
      p.missed=(r.missed||[]).slice(0,60).map(function(m){return {item:clip(m.item,160),typed:clip(m.typed,80),correct:clip(m.correct,200),skill:clip(m.skill,120)};});
    }else{
      p.missed=S.answers.filter(function(x){return !x.ok;}).slice(0,60).map(function(x){return {item:x.q,typed:x.given,correct:x.correct,skill:x.skill};});
    }
    p.percent=p.total?Math.round(100*p.score/p.total):null;
    p.durationSec=Math.round((now.getTime()-Date.parse(p.startedAt))/1000);
    var L=S.leaves,tot=0,lon=0;L.forEach(function(x){tot+=x.seconds;lon=Math.max(lon,x.seconds);});
    p.leftPage=L.length>0;p.leaveCount=L.length;p.awaySeconds=tot;p.longestAwaySeconds=lon;
    p.leaves=L.slice(0,50).map(function(x){return {at:new Date(x.at).toISOString(),seconds:x.seconds};});
    return p;
  }
  // ---- leave tracking: tab hidden or window blurred, counted only if away > 1.5 s (ignores iOS keyboard / in-page
  // focus blips); hidden+blur at the same time = ONE leave. Only while a session is active (after begin, before finish).
  var LEAVE_MIN=1500;
  function isAway(){return document.hidden||(typeof document.hasFocus==="function"&&!document.hasFocus());}
  function awayStart(){
    if(!on||!S||S.done||S.away) return;
    var a=S.away={t:Date.now(),confirmed:false,sess:S};
    a.timer=setTimeout(function(){if(S===a.sess&&S.away===a&&isAway()){a.confirmed=true;log.push("leave-confirmed");
      a.poll=setInterval(function(){if(!isAway()) awayEnd();},1000);} else if(S&&S.away===a) awayEnd();},LEAVE_MIN);
  }
  function awayEnd(){
    if(!S||!S.away) return;
    var a=S.away;S.away=null;clearTimeout(a.timer);clearInterval(a.poll);
    var ms=Date.now()-a.t;
    if(a.confirmed||ms>LEAVE_MIN){S.leaves.push({at:a.t,seconds:Math.max(2,Math.round(ms/1000))});log.push("leave:"+Math.round(ms/1000)+"s");}
  }
  function onBack(){if(!isAway()) awayEnd();}
  function post(p){
    if(!on) return Promise.reject(new Error("off"));
    if(typeof fetch!=="function") return Promise.reject(new Error("no fetch"));
    if(navigator.onLine===false) return Promise.reject(new Error("offline"));
    var req=fetch(CFG.url,{method:"POST",mode:"no-cors",cache:"no-store",keepalive:JSON.stringify(p).length<60000,
      headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(p)});
    var to=new Promise(function(_,rej){setTimeout(function(){rej(new Error("timeout"));},TIMEOUT);});
    return Promise.race([req,to]).then(function(){log.push("sent:"+qid(p));});
  }
  // page is going away: sendBeacon survives unload; fall back to fetch keepalive; queue if offline/refused
  function beacon(p){
    var body=JSON.stringify(p),ok=false;
    if(navigator.onLine===false){enqueue(p);return false;}
    try{if(navigator.sendBeacon) ok=navigator.sendBeacon(CFG.url,new Blob([body],{type:"text/plain;charset=UTF-8"}));}catch(e){ok=false;}
    if(ok){log.push("beacon:"+qid(p));return true;}
    try{fetch(CFG.url,{method:"POST",mode:"no-cors",keepalive:true,headers:{"Content-Type":"text/plain;charset=utf-8"},body:body})
      .then(function(){log.push("keepalive:"+qid(p));},function(){enqueue(p);});}catch(e){enqueue(p);}
    enqueue(p); // keepalive may die with the page; keep a copy (server de-dupes by session id)
    return false;
  }
  function flush(){
    if(!on||flushing) return Promise.resolve(0);
    var q=loadQ();if(!q.length) return Promise.resolve(0);
    try{var lk=+localStorage.getItem(QKEY+"_lock")||0;if(Date.now()-lk<10000){setTimeout(flush,10500);return Promise.resolve(0);}localStorage.setItem(QKEY+"_lock",String(Date.now()));}catch(e){}
    flushing=true;var n=0;log.push("flush:"+q.length);
    return q.reduce(function(chain,p){
      return chain.then(function(){if(!loadQ().some(function(x){return x&&qid(x)===qid(p);})) return;return post(p).then(function(){dequeue(p);n++;},function(){log.push("retry-failed:"+qid(p));});});
    },Promise.resolve()).then(function(){flushing=false;try{localStorage.removeItem(QKEY+"_lock");}catch(e){}return n;});
  }
  function abandon(why){ // send "incomplete" for an active session with >=1 answer (once per answer count)
    var k=S&&(S.answers.length+":"+S.leaves.length);
    if(!on||!S||S.done||!S.answers.length||S.sentIncomplete===k) return null;
    S.sentIncomplete=k;
    var p=payload("incomplete");p.reason=why;window.__lastIncomplete=p;beacon(p);return p;
  }
  function init(o){o=o||{};meta={kid:clip(o.kid,40),topic:clip(o.topic||o.page,80),title:clip(o.title||o.page,120),subject:clip(o.subject,40),page:clip(o.page||o.title,160)};}
  function begin(o){if(!on) return;abandon("started something else");if(S){clearTimeout(S.away&&S.away.timer);clearInterval(S.away&&S.away.poll);}S=newSession(o);log.push("begin:"+S.id);}
  function answer(a){
    if(!on) return;
    a=a||{};if(!S||S.done) S=newSession({mode:a.mode});
    var k=String(a.key!=null?a.key:a.q);if(S.keys[k]) return;S.keys[k]=1;
    S.answers.push({q:clip(a.q,160),given:clip(a.given==null||a.given===""?"(blank)":a.given,80),correct:clip(a.correct,200),ok:!!a.ok,skill:clip(a.skill,120)});
  }
  // end screen: builds the payload, adds a small status line into `card`, sends it (queues it if offline)
  function finish(r,card){
    if(!on) return null;
    var p;
    try{if(!S||S.done) S=newSession(r);awayEnd();S.done=true;p=payload("complete",r);}catch(e){log.push("build-error:"+e);return null;}
    window.__lastReport=p;
    var box=document.createElement("div");box.className="report-box";box.id="reportBox";
    box.style.cssText="margin-top:14px;font-size:18px;color:#5b6b7d;text-align:center;font-weight:normal";
    var st=document.createElement("div");st.id="reportStatus";st.textContent="Sending results to Dad…";box.appendChild(st);
    if(card) card.appendChild(box);
    saveQ(loadQ().filter(function(x){return x&&x.sessionId!==p.sessionId;}));
    post(p).then(function(){st.textContent="Results sent to Dad ✓";st.style.color="#2e8b57";flush();},
      function(e){enqueue(p);log.push("send-failed:"+(e&&e.message));
        st.textContent="No internet right now. Results saved; they'll go to Dad next time this page opens.";st.style.color="#b0641a";});
    return p;
  }
  if(on){
    try{localStorage.removeItem(OLDQ);}catch(e){}
    setTimeout(flush,1500);
    window.addEventListener("online",function(){flush();});
    window.addEventListener("pagehide",function(){abandon("page closed");});
    // hidden: start a possible leave AND send a provisional "incomplete" (server waits 10 min; coming back and
    // finishing supersedes it, and the complete report carries the final leave counts)
    document.addEventListener("visibilitychange",function(){if(document.visibilityState==="hidden"){awayStart();abandon("page hidden");}else onBack();});
    window.addEventListener("blur",function(){setTimeout(function(){if(isAway()) awayStart();},0);});
    window.addEventListener("focus",onBack);
  }
  window.__report={cfg:CFG,queue:loadQ,flush:flush,payload:function(s){return S&&payload(s||"incomplete");},session:function(){return S;},isAway:isAway,abandon:abandon,QKEY:QKEY};
  return {init:init,begin:begin,answer:answer,finish:finish,flush:flush,enabled:on};
})();
</script>
<script>
(function(){
"use strict";
var main=document.getElementById("main"),pill=document.getElementById("pill");
var LS_PB="eliMultRaceBest";
Report.init({kid:"Eli",topic:"eli-multiplication",title:"Multiplication facts",subject:"Math",page:"Eli's Multiplication Facts"});
// ---- for the report to Dad: a short "what to practice" label and a log of wrong answers ----
function factSkill(a,b){
  var x=Math.min(a,b),y=Math.max(a,b);
  if(x<=1) return "×0 and ×1 rules";
  if(a===b) return "Squares ("+a+"×"+a+")";
  var hard=[7,8,6,9,12].filter(function(n){return n===a||n===b;})[0];
  return (hard||y)+"s facts";
}
function wrongLog(){ // remembers what Eli typed the first few times he got a fact wrong
  var m={};
  return {add:function(k,v){v=String(v==null?"":v).trim()||"(blank)";(m[k]=m[k]||[]);if(m[k].length<3)m[k].push(v);},
          get:function(k){return (m[k]||[]).join(", ");}};
}
function factRows(list,typed,keyFn){
  return list.map(function(f){var k=keyFn?keyFn(f):f.a+"x"+f.b;
    return {item:f.q||(f.a+" × "+f.b),typed:typed.get(k),correct:String(f.ans!=null?f.ans:f.p),skill:factSkill(f.a,f.b)};});
}
function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;}
function btn(cls,html,fn,id){var b=el("button",cls,html);b.type="button";if(id)b.id=id;b.addEventListener("click",fn);return b;}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function rand(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function celebrate(big){
  var cols=["#ff5c8a","#ffd23f","#3bceac","#4d96ff","#a66cff","#ff922b"],n=big?60:28;
  for(var i=0;i<n;i++){
    var c=el("span","conf"+(i%4===0?" star":""),i%4===0?"⭐":"");
    c.style.left=(Math.random()*100)+"vw";c.style.background=cols[i%cols.length];
    c.style.setProperty("--dx",(Math.random()*160-80)+"px");c.style.animationDelay=(Math.random()*.35)+"s";
    document.body.appendChild(c);(function(x){setTimeout(function(){x.remove();},2300);})(c);
  }
}
function cheer(){var k="fb_c"+Math.floor(Math.random()*6);if(window.Voice)Voice.play(k);}
function sayTry(){if(window.Voice)Voice.play("fb_try");}
function sayDone(all){if(window.Voice)Voice.play(all?"fb_doneall":"fb_done");}
function speakFact(a,b){
  if(!window.Voice) return;
  Voice.play([{k:"what",gap:120},{k:"n_"+a,gap:80},{k:"times",gap:80},{k:"n_"+b,gap:0}]);
}
function speakMissing(a,b,p,which){
  if(!window.Voice) return;
  // "Find the missing number." then speak known parts
  var seq=[{k:"find",gap:200}];
  if(which==="a"){seq.push({k:"times",gap:80},{k:"n_"+b,gap:80},{k:"equals",gap:80},{k:"n_"+Math.min(p,12),gap:0});}
  // products >12: just speak find; numbers only go to 12 in clips
  Voice.play(seq);
}

// ---- Strategy hints ----
function hintFor(a,b){
  var x=Math.min(a,b),y=Math.max(a,b),p=a*b;
  if(a===0||b===0) return "Any number times 0 is 0. Nothing groups!";
  if(a===1||b===1) return "Times 1 keeps the number the same. "+y+" × 1 = "+y+".";
  if(x===2) return "2s are doubles: "+y+" + "+y+" = "+(2*y)+".";
  if(x===10) return "10s: write "+y+" and stick a zero on the end → "+(10*y)+".";
  if(x===5) return "5s: half of 10 × "+y+" = "+(10*y)+". Half is "+(5*y)+". Or skip-count by 5s.";
  if(x===9){
    return "9s finger trick: fold down finger "+y+". Left fingers = tens, right = ones. Digits add to 9. Answer: "+p+".";
  }
  if(a===b) return "That's a square! "+a+" × "+a+" = "+p+". Memorize the doubles: 6×6=36, 7×7=49, 8×8=64, 9×9=81, 12×12=144.";
  if(x===11) return "11 × "+y+": write "+y+" twice for 1–9 (11×"+y+" = "+p+").";
  // double-and-add near doubles
  if(Math.abs(a-b)===1){
    var d=Math.min(a,b); return "Near double: "+d+" × "+d+" = "+(d*d)+", then add one more "+d+" → "+p+".";
  }
  // turn-around
  if(a>b) return "Turn it around! "+b+" × "+a+" is the same as "+a+" × "+b+". Try the easier order. Answer: "+p+".";
  if(x===6) return "6 × "+y+": think 5 × "+y+" = "+(5*y)+", then add one more "+y+" → "+p+". Or double 3 × "+y+".";
  if(x===7) return "7 × "+y+": try 5 × "+y+" = "+(5*y)+" plus 2 × "+y+" = "+(2*y)+" → "+p+". Or use a nearby double.";
  if(x===8) return "8 × "+y+": double-double! 2 × "+y+" = "+(2*y)+", double again = "+(4*y)+", double again = "+p+".";
  if(x===12) return "12 × "+y+": 10 × "+y+" = "+(10*y)+" plus 2 × "+y+" = "+(2*y)+" → "+p+".";
  return "Skip-count by "+x+": keep adding "+x+", "+y+" times. Or use turn-around: "+y+" × "+x+". Answer: "+p+".";
}

function makeFacts(tables, opts){
  opts=opts||{};
  var out=[], hardBoost=opts.hardBoost!==false;
  tables.forEach(function(t){
    for(var i=0;i<=12;i++){
      out.push({a:t,b:i,p:t*i});
      if(opts.bothOrders && i!==t) out.push({a:i,b:t,p:t*i});
    }
  });
  if(hardBoost){
    // extra copies of hard facts
    var extra=[];
    out.forEach(function(f){
      if([6,7,8,9,12].indexOf(f.a)>=0 || [6,7,8,9,12].indexOf(f.b)>=0) extra.push(f);
    });
    out=out.concat(extra);
  }
  return shuffle(out);
}

function clear(){if(window.Voice)Voice.stop(); main.innerHTML="";}

// ===================== HOME =====================
function home(){
  clear(); pill.textContent="⭐ Ready!";
  var card=el("div","card");
  card.appendChild(el("h2",null,"Pick a mode"));
  card.appendChild(el("p","note","Facts 0–12. Extra practice on the hard ones: 6s, 7s, 8s, 9s, and 12s. Strategies help!"));
  var menu=el("div","menu");
  menu.appendChild(btn("blue","📚 Practice by table<br><small>Pick a factor, get hints on misses</small>",function(){pickTables("table");},"mTable"));
  menu.appendChild(btn("green","🎲 Mix-up quiz<br><small>Random facts · score · redo missed</small>",function(){pickTables("quiz");},"mQuiz"));
  menu.appendChild(btn("orange","⏱️ Race the clock<br><small>60 seconds · beat your best</small>",function(){pickTables("race");},"mRace"));
  menu.appendChild(btn("purple","❓ Missing factor<br><small>__ × 7 = 56 — find what's missing</small>",function(){pickTables("missing");},"mMissing"));
  menu.appendChild(btn("teal","🔺 Fact family<br><small>Pick the true sentence from three numbers</small>",function(){startFamily();},"mFamily"));
  card.appendChild(menu);
  var pb=localStorage.getItem(LS_PB);
  if(pb) card.appendChild(el("p","pb","🏁 Race personal best: "+pb+" correct in 60s"));
  main.appendChild(card);
  if(window.Voice && Voice.has("fb_welcome")) {/* don't autoplay — browsers block */}
}

function pickTables(mode){
  clear(); pill.textContent="Choose tables";
  var card=el("div","card");
  card.appendChild(el("h2",null,mode==="race"?"Race — which tables?":"Which tables to practice?"));
  card.appendChild(el("p","sub","Tap to select. Hard ones (6–9, 12) are highlighted."));
  var selected={};
  // default: hard ones on for quiz/race/missing; for table mode none yet
  var defaults= mode==="table"? [] : [6,7,8,9,12];
  defaults.forEach(function(n){selected[n]=true;});
  var row=el("div","factors");
  for(var n=2;n<=12;n++){
    (function(n){
      var hard=[6,7,8,9,12].indexOf(n)>=0;
      var b=btn((hard?"orange":"blue")+(selected[n]?" on":""),String(n),function(){
        selected[n]=!selected[n];
        b.classList.toggle("on",!!selected[n]);
      });
      b.dataset.n=n; row.appendChild(b);
    })(n);
  }
  card.appendChild(row);
  var quick=el("div","row");
  quick.appendChild(btn("teal big","Hard ones (6–9,12)",function(){
    selected={}; [6,7,8,9,12].forEach(function(n){selected[n]=true;});
    row.querySelectorAll("button").forEach(function(b){b.classList.toggle("on",!!selected[+b.dataset.n]);});
  }));
  quick.appendChild(btn("purple big","All 2–12",function(){
    selected={}; for(var i=2;i<=12;i++) selected[i]=true;
    row.querySelectorAll("button").forEach(function(b){b.classList.add("on");});
  }));
  card.appendChild(quick);
  card.appendChild(btn("green big","▶️ Start!",function(){
    var tables=Object.keys(selected).filter(function(k){return selected[k];}).map(Number).sort(function(a,b){return a-b;});
    if(!tables.length){alert("Pick at least one table!");return;}
    if(mode==="table") startTable(tables);
    else if(mode==="quiz") startQuiz(tables);
    else if(mode==="race") startRace(tables);
    else if(mode==="missing") startMissing(tables);
  },"startBtn"));
  card.appendChild(el("p","note","Tip: for Practice by table, pick one factor (or a few) to focus."));
  main.appendChild(card);
}

function showEnd(opts){
  // opts: {score,total,missed:[{a,b,p}], title, mode, tables, restart}
  clear(); celebrate(opts.score===opts.total || opts.score>=10);
  sayDone(opts.score===opts.total && opts.total>0);

}

function answerUI(onCheck, opts){
  opts=opts||{};
  var wrap=el("div");
  var inp=el("input","ans"); inp.id="ansIn"; inp.type="text"; inp.inputMode="numeric"; inp.autocomplete="off"; inp.setAttribute("aria-label","Answer");
  wrap.appendChild(inp);
  var msg=el("div","msg"); msg.id="msg"; wrap.appendChild(msg);
  var hint=el("div","hintbox"); hint.id="hintbox"; wrap.appendChild(hint);

  setTimeout(function(){inp.focus();},50);

}

function grade(inp,msg,hint,check,next, ok, fact, showHint){
  if(ok){
    inp.className="ans ok"; msg.className="msg right"; msg.innerHTML="✅ Yes! "+fact.a+" × "+fact.b+" = "+fact.p;
    hint.classList.remove("show"); celebrate(false); cheer();
    check.disabled=true; next.disabled=false; next.style.display=""; next.focus();
  } else {
    inp.className="ans bad shake"; msg.className="msg wrong"; msg.textContent="Not quite — try again!";
    sayTry();
    if(showHint){
      hint.textContent="💡 "+hintFor(fact.a,fact.b);
      hint.classList.add("show");
      if(window.Voice && Voice.has("fb_hint")) Voice.play("fb_hint");
    }
    setTimeout(function(){inp.classList.remove("shake");inp.select();},400);
  }
}

// ===================== (a) Practice by table =====================
function startTable(tables){
  var facts=makeFacts(tables,{bothOrders:true,hardBoost:true});
  // keep a reasonable round length
  if(facts.length>24) facts=facts.slice(0,24);
  var i=0,score=0,missed=[],tries=0,round=1,t0=Date.now(),typed=wrongLog();
  var RB=function(){Report.begin({mode:"Practice by Table ("+tables.join(", ")+")",total:facts.length,round:round});};RB();
  function show(){
    clear();
    if(i>=facts.length){
      showEnd({score:score,total:facts.length,missed:missed,title:"Table practice done!",
        restart:function(){startTable(tables);},
        onMissed:function(m){facts=shuffle(m.slice());i=0;score=0;missed=[];round++;t0=Date.now();typed=wrongLog();RB();show();},
        report:{mode:"Practice by Table ("+tables.join(", ")+")",round:round,score:score,total:facts.length,startedAt:t0,missed:factRows(missed,typed)}});
      return;
    }
    var f=facts[i]; tries=0;
    pill.textContent="⭐ "+score+" · "+(i+1)+"/"+facts.length;
    var card=el("div","card");
    card.appendChild(el("div","prog","Table practice · "+tables.join(", ")+"s"));
    var bar=el("div","progress"); var fill=el("div"); fill.style.width=((i/facts.length)*100)+"%"; bar.appendChild(fill); card.appendChild(bar);
    card.appendChild(el("div","qtext",f.a+" × "+f.b+" = ?"));
    var ui=answerUI(function(v){
      var n=parseInt(String(v).replace(/\s/g,""),10);
      var ok=n===f.p;
      Report.answer({key:i,q:f.a+" × "+f.b+" = ?",given:v,correct:f.p,ok:ok,skill:factSkill(f.a,f.b)});
      tries++;
      if(ok){score++; grade(ui.inp,ui.msg,ui.hint,ui.check,ui.next,true,f,false);}
      else {
        typed.add(f.a+"x"+f.b,v);
        var give=tries>=2;
        grade(ui.inp,ui.msg,ui.hint,ui.check,ui.next,false,f,give);
        if(give){
          // after hint, allow moving on and record miss
          if(missed.every(function(m){return !(m.a===f.a&&m.b===f.b);})) missed.push(f);
          ui.msg.innerHTML="💡 Look at the hint, then continue.";
          ui.check.disabled=true; ui.next.disabled=false; ui.next.style.display="";
          // reveal answer in hint already
        }
      }
    },{speak:function(){speakFact(f.a,f.b);},onNext:function(){i++;show();}});
    card.appendChild(ui.wrap);
    main.appendChild(card);
  }
  show();
}

// ===================== (b) Mix-up quiz =====================
function startQuiz(tables){
  var facts=makeFacts(tables,{bothOrders:true,hardBoost:true});
  if(facts.length>20) facts=facts.slice(0,20);
  var i=0,score=0,missed=[],round=1,t0=Date.now(),typed=wrongLog();
  var RB=function(){Report.begin({mode:"Mix-up Quiz",total:facts.length,round:round});};RB();
  function show(){
    clear();
    if(i>=facts.length){
      showEnd({score:score,total:facts.length,missed:missed,title:"Quiz complete!",
        restart:function(){startQuiz(tables);},
        onMissed:function(m){facts=shuffle(m.slice());i=0;score=0;missed=[];round++;t0=Date.now();typed=wrongLog();RB();show();},
        report:{mode:"Mix-up Quiz",round:round,score:score,total:facts.length,startedAt:t0,missed:factRows(missed,typed)}});
      return;
    }
    var f=facts[i], tried=false;
    pill.textContent="⭐ "+score+" · "+(i+1)+"/"+facts.length;
    var card=el("div","card");
    card.appendChild(el("div","prog","Mix-up quiz"));
    var bar=el("div","progress"); var fill=el("div"); fill.style.width=((i/facts.length)*100)+"%"; bar.appendChild(fill); card.appendChild(bar);
    card.appendChild(el("div","qtext",f.a+" × "+f.b+" = ?"));
    var ui=answerUI(function(v){
      var n=parseInt(String(v).replace(/\s/g,""),10);
      var ok=n===f.p;
      Report.answer({key:i,q:f.a+" × "+f.b+" = ?",given:v,correct:f.p,ok:ok,skill:factSkill(f.a,f.b)});
      if(ok){
        if(!tried) score++;
        grade(ui.inp,ui.msg,ui.hint,ui.check,ui.next,true,f,false);
      } else {
        tried=true;typed.add(f.a+"x"+f.b,v);
        if(missed.every(function(m){return !(m.a===f.a&&m.b===f.b);})) missed.push(f);
        grade(ui.inp,ui.msg,ui.hint,ui.check,ui.next,false,f,true);
        // show correct after miss in quiz? keep trying until right, but already counted miss
      }
    },{speak:function(){speakFact(f.a,f.b);},onNext:function(){i++;show();}});
    card.appendChild(ui.wrap);
    main.appendChild(card);
  }
  show();
}

// ===================== (c) Race =====================
function startRace(tables){
  var pool=makeFacts(tables,{bothOrders:true,hardBoost:true});
  var score=0, i=0, left=60, timer=null, alive=true, t0=Date.now(), typed=wrongLog(), wrong=[];
  Report.begin({mode:"60-Second Race ("+tables.join(", ")+")",total:null});
  function tick(){
    left--;
    var t=document.getElementById("timer");
    if(t) t.textContent="⏱️ "+left+"s";
    if(left<=0){ finish(); }
  }
  function finish(){
    if(!alive) return; alive=false;
    clearInterval(timer);
    if(window.Voice) Voice.play("fb_race");
    var best=parseInt(localStorage.getItem(LS_PB)||"0",10);
    var extra="";
    if(score>best){ localStorage.setItem(LS_PB,String(score)); extra="🏆 New personal best! ("+score+")"; if(window.Voice) setTimeout(function(){Voice.play("fb_pb");},900); }
    else if(best) extra="Personal best: "+best;
    showEnd({score:score,total:null,title:"Time's up!",extra:extra,
      restart:function(){startRace(tables);},
      report:{mode:"60-Second Race ("+tables.join(", ")+")",round:1,score:score,total:null,startedAt:t0,missed:factRows(wrong,typed)}});
    var sc=document.getElementById("finalScore"); if(sc) sc.textContent=String(score);
  }
  function show(){
    if(!alive) return;
    clear();
    var f=pool[i%pool.length];
    pill.textContent="🏁 "+score+" correct";
    var card=el("div","card");
    card.appendChild(el("div","timer","⏱️ "+left+"s")).id="timer";
    card.appendChild(el("div","qtext",f.a+" × "+f.b+" = ?"));
    var ui=answerUI(function(v){
      if(!alive) return;
      var n=parseInt(String(v).replace(/\s/g,""),10);
      Report.answer({key:"r"+i,q:f.a+" × "+f.b+" = ?",given:v,correct:f.p,ok:n===f.p,skill:factSkill(f.a,f.b)});
      if(n===f.p){
        score++; i++; celebrate(false); cheer();
        show(); // next immediately
      } else {
        typed.add(f.a+"x"+f.b,v); if(wrong.every(function(m){return !(m.a===f.a&&m.b===f.b);})) wrong.push(f);
        ui.inp.className="ans bad shake"; sayTry();
        setTimeout(function(){ui.inp.classList.remove("shake");ui.inp.select();},300);
      }
    },{speak:function(){speakFact(f.a,f.b);}});
    // hide next in race
    ui.next.style.display="none";
    card.appendChild(ui.wrap);
    card.appendChild(el("p","note","Type fast! Wrong answers stay — fix them. No penalty."));
    main.appendChild(card);
  }
  show();
  timer=setInterval(tick,1000);
}

// ===================== (d) Missing factor =====================
function startMissing(tables){
  var facts=makeFacts(tables,{bothOrders:false,hardBoost:true}).filter(function(f){return f.a>=2&&f.b>=2;});
  if(facts.length>18) facts=facts.slice(0,18);
  // convert to missing-factor prompts
  var items=facts.map(function(f){
    var which=Math.random()<0.5?"a":"b";
    return {a:f.a,b:f.b,p:f.p,which:which, ans: which==="a"?f.a:f.b};
  });
  var i=0,score=0,missed=[],round=1,t0=Date.now(),typed=wrongLog();
  var RB=function(){Report.begin({mode:"Missing Factor",total:items.length,round:round});};RB();
  function mq(f){return f.which==="a" ? ("__ × "+f.b+" = "+f.p) : (f.a+" × __ = "+f.p);}
  function mk(f){return f.a+"x"+f.b+f.which;}
  function show(){
    clear();
    if(i>=items.length){
      showEnd({score:score,total:items.length,missed:missed.map(function(m){return {a:m.a,b:m.b,p:m.p};}),title:"Missing factor done!",
        restart:function(){startMissing(tables);},
        onMissed:function(){items=shuffle(missed.slice());i=0;score=0;missed=[];round++;t0=Date.now();typed=wrongLog();RB();show();},
        report:{mode:"Missing Factor",round:round,score:score,total:items.length,startedAt:t0,
          missed:factRows(missed.map(function(m){return {a:m.a,b:m.b,p:m.p,ans:m.ans,which:m.which,q:mq(m)};}),typed,mk)}});
      return;
    }
    var f=items[i], tried=false;
    pill.textContent="⭐ "+score+" · "+(i+1)+"/"+items.length;
    var card=el("div","card");
    card.appendChild(el("div","prog","Missing factor"));
    var q= f.which==="a" ? ("__ × "+f.b+" = "+f.p) : (f.a+" × __ = "+f.p);
    card.appendChild(el("div","qtext",q));
    card.appendChild(el("p","sub","What number goes in the blank?"));
    var ui=answerUI(function(v){
      var n=parseInt(String(v).replace(/\s/g,""),10);
      var ok=n===f.ans;
      Report.answer({key:mk(f),q:mq(f),given:v,correct:f.ans,ok:ok,skill:factSkill(f.a,f.b)});
      if(ok){
        if(!tried) score++;
        ui.inp.className="ans ok"; ui.msg.className="msg right";
        ui.msg.innerHTML="✅ Yes! "+f.a+" × "+f.b+" = "+f.p;
        celebrate(false); cheer();
        ui.check.disabled=true; ui.next.disabled=false; ui.next.style.display=""; ui.next.focus();
      } else {
        tried=true;typed.add(mk(f),v);
        if(missed.every(function(m){return !(m.a===f.a&&m.b===f.b&&m.which===f.which);})) missed.push(f);
        ui.inp.className="ans bad shake"; ui.msg.className="msg wrong"; ui.msg.textContent="Not quite — try again!";
        sayTry();
        ui.hint.textContent="💡 Think: what times "+(f.which==="a"?f.b:f.a)+" equals "+f.p+"? Hint: "+hintFor(f.a,f.b);
        ui.hint.classList.add("show");
        setTimeout(function(){ui.inp.classList.remove("shake");ui.inp.select();},400);
      }
    },{onNext:function(){i++;show();}});
    card.appendChild(ui.wrap);
    main.appendChild(card);
  }
  show();
}

// ===================== (e) Fact family =====================
function startFamily(){
  var families=[
    [4,6,24],[6,6,36],[6,7,42],[6,8,48],[6,9,54],[7,7,49],
    [7,8,56],[7,9,63],[8,8,64],[8,9,72],[9,9,81],[7,12,84],
    [8,12,96],[9,12,108],[5,8,40],[4,9,36],[3,8,24],[12,12,144]
  ];
  families=shuffle(families).slice(0,12);
  var i=0,score=0,missed=[],round=1,t0=Date.now(),typed=wrongLog();
  var RB=function(){Report.begin({mode:"Fact Family",total:families.length,round:round});};RB();
  function show(){
    clear();
    if(i>=families.length){
      showEnd({score:score,total:families.length,missed:missed.map(function(m){return {a:m[0],b:m[1],p:m[2]};}),
        title:"Fact families done!",
        restart:startFamily,
        onMissed:function(m){families=shuffle(missed.slice());i=0;score=0;missed=[];round++;t0=Date.now();typed=wrongLog();RB();show();},
        report:{mode:"Fact Family",round:round,score:score,total:families.length,startedAt:t0,
          missed:factRows(missed.map(function(m){return {a:m[0],b:m[1],p:m[2],q:"Fact family "+m[0]+", "+m[1]+", "+m[2],ans:m[0]+" × "+m[1]+" = "+m[2]};}),typed)}});
      return;
    }
    var fam=families[i], a=fam[0],b=fam[1],p=fam[2];
    // shuffle three numbers display
    var nums=shuffle([a,b,p]);
    // build 4 choices: 2 true mult, 1 true-looking wrong, 1 wrong
    var true1=a+" × "+b+" = "+p;
    var true2=b+" × "+a+" = "+p;
    var wrongs=[
      a+" × "+p+" = "+b,
      b+" × "+p+" = "+a,
      a+" × "+b+" = "+(p+a),
      (a+1)+" × "+b+" = "+p
    ];
    var choices=shuffle([
      {t:true1,ok:true},{t:true2,ok:true},
      {t:wrongs[0],ok:false},{t:wrongs[2],ok:false}
    ]);
    // ensure unique text
    var seen={}; choices=choices.filter(function(c){if(seen[c.t])return false;seen[c.t]=1;return true;});
    while(choices.length<4){
      var w=a+" × "+b+" = "+(p+choices.length);
      if(!seen[w]){choices.push({t:w,ok:false});seen[w]=1;}
      else break;
    }
    pill.textContent="⭐ "+score+" · "+(i+1)+"/"+families.length;
    var card=el("div","card");
    card.appendChild(el("div","prog","Fact family — pick a TRUE multiplication sentence"));
    var famEl=el("div","fam");
    nums.forEach(function(n){famEl.appendChild(el("span",null,String(n)));});
    card.appendChild(famEl);
    card.appendChild(el("p","sub","These three numbers make a fact family. Which sentence is true?"));
    var box=el("div","choices"); box.id="choices";
    var locked=false;
    choices.forEach(function(ch,idx){
      var bb=btn("",ch.t,function(){
        if(locked) return; locked=true;
        Report.answer({key:a+"x"+b,q:"Fact family "+a+", "+b+", "+p+": pick a true sentence",given:"picked "+ch.t,correct:true1,ok:ch.ok,skill:factSkill(a,b)});
        if(ch.ok){
          bb.classList.add("ok"); score++; celebrate(false);
          if(window.Voice) Voice.play("fb_family"); else cheer();
          document.getElementById("msg").className="msg right";
          document.getElementById("msg").textContent="✅ Correct! "+a+" × "+b+" = "+p+" (and turn-around too!)";
        } else {
          bb.classList.add("bad"); typed.add(a+"x"+b,"picked "+ch.t);
          // highlight a correct one
          box.querySelectorAll("button").forEach(function(btnEl,j){if(choices[j].ok) btnEl.classList.add("ok");});
          sayTry();
          document.getElementById("msg").className="msg wrong";
          document.getElementById("msg").innerHTML="Not that one. True facts: <b>"+true1+"</b> and <b>"+true2+"</b>";
          if(missed.every(function(m){return !(m[0]===a&&m[1]===b);})) missed.push(fam);
        }
        var next=document.getElementById("nextBtn"); next.disabled=false; next.focus();
      });
      bb.dataset.idx=idx; box.appendChild(bb);
    });
    card.appendChild(box);
    card.appendChild(el("div","msg")).id="msg";
    var row=el("div","row");
    var next=btn("blue big","Next →",function(){i++;show();},"nextBtn");
    next.disabled=true; row.appendChild(next);
    card.appendChild(row);
    main.appendChild(card);
  }
  show();
}

document.getElementById("homeBtn").addEventListener("click",home);
// expose for tests
window.__mult={home:home,hintFor:hintFor,makeFacts:makeFacts,LS_PB:LS_PB,
  startTable:startTable,startQuiz:startQuiz,startRace:startRace,startMissing:startMissing,startFamily:startFamily};
home();
})();
