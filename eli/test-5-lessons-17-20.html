:root{--blue:#2a6fb0;--green:#2e8b57;--orange:#e07b1f;--purple:#7b4fa3;--red:#d64545;--bg:#eef6ff;--card:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:"Andika","Trebuchet MS","Segoe UI",system-ui,sans-serif;background:linear-gradient(160deg,#dff0ff,#fdf3e1);color:#1d2a3a;min-height:100vh;font-size:24px;line-height:1.35}
header{background:var(--blue);color:#fff;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:5;box-shadow:0 3px 8px rgba(0,0,0,.15)}
header h1{font-size:26px;margin:0;flex:1;min-width:220px}
.pill{background:rgba(255,255,255,.2);border-radius:999px;padding:6px 14px;font-weight:bold;font-size:20px;white-space:nowrap}
.wrap{max-width:900px;margin:0 auto;padding:16px}
.progress{height:16px;background:#cfe0f2;border-radius:10px;overflow:hidden;margin:4px 0 14px}
.progress div{height:100%;background:linear-gradient(90deg,#33b36b,#7bd88f);width:0;transition:width .3s}
.card{background:var(--card);border-radius:22px;padding:22px 24px;box-shadow:0 6px 18px rgba(30,60,100,.13);position:relative}
.qnum{display:inline-block;background:var(--orange);color:#fff;font-weight:bold;border-radius:14px;padding:4px 14px;font-size:22px}
.skill{color:var(--purple);font-size:18px;font-weight:bold;margin-left:8px}
.qtext{font-size:30px;margin:14px 0 18px;font-weight:bold}
.fields{display:flex;flex-wrap:wrap;gap:14px 18px;align-items:center}
.field{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:28px}
.field.row{flex-basis:100%}
input.ans{font:inherit;font-size:30px;padding:8px 12px;border:3px solid #9bb7d4;border-radius:14px;width:190px;min-height:60px;background:#fbfdff;color:#123}
input.ans.wide{width:min(520px,100%)}
input.ans.small{width:110px}
input.ans:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px rgba(42,111,176,.2)}
.ok input.ans,input.ans.ok{border-color:var(--green);background:#e9f8ef}
input.ans.bad{border-color:var(--red);background:#fdeeee}
.choices{display:flex;gap:12px;flex-wrap:wrap}
.choices.vert{flex-direction:column;align-items:stretch;width:100%}
button{font:inherit;cursor:pointer;border:none;border-radius:16px;touch-action:manipulation}
.ch{background:#eef3fa;border:3px solid #9bb7d4;font-size:28px;min-width:76px;min-height:64px;padding:8px 18px;color:#123;text-align:left}
.ch.sym{font-size:38px;font-weight:bold;text-align:center;min-width:90px}
.ch.sel{background:#dbe9ff;border-color:var(--blue);box-shadow:0 0 0 4px rgba(42,111,176,.2)}
.ch.ok{background:#e9f8ef;border-color:var(--green)}
.ch.bad{background:#fdeeee;border-color:var(--red)}
.ch svg{display:block;margin-top:6px;max-width:100%}
.btns{display:flex;gap:14px;flex-wrap:wrap;margin-top:22px}
.big{font-size:28px;font-weight:bold;padding:14px 28px;min-height:66px;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.check{background:var(--green)}.next{background:var(--blue)}.show{background:var(--purple)}.restart{background:var(--orange)}.gray{background:#7a8899}
.big[disabled]{opacity:.45}
.feedback{margin-top:18px;border-radius:16px;padding:14px 18px;font-size:24px;display:none}
.feedback.right{display:block;background:#e3f7ea;border:3px solid var(--green)}
.feedback.wrong{display:block;background:#fff4e0;border:3px solid var(--orange)}
.feedback b.t{font-size:30px;display:block;margin-bottom:6px}
.hint{white-space:pre-line}
.answer{display:block;margin-top:10px;background:#f3ecfb;border-radius:12px;padding:10px 14px;border:2px dashed var(--purple)}
.tip{font-size:18px;color:#5b6b7d;margin-top:8px}
.end{text-align:center}
.end .score{font-size:72px;font-weight:bold;color:var(--green);margin:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0}
.chip{background:#fdeeee;border:2px solid var(--red);border-radius:999px;padding:4px 14px;font-size:22px}
.stars{font-size:46px}
.burst{position:fixed;pointer-events:none;z-index:50;font-size:34px;animation:fly 1s ease-out forwards}
@keyframes fly{0%{transform:translate(0,0) scale(.5);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.2) rotate(200deg);opacity:0}}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.foot{text-align:center;margin-top:16px}
@media (max-width:600px){body{font-size:20px}.qtext{font-size:25px}header h1{font-size:21px}input.ans{width:150px}}
</style>
</head>
<body>
<header>
  <h1>🧮 Eli's Math Practice: Test #5</h1>
  <span class="pill" id="score">⭐ 0</span>
  <span class="pill" id="where">1 / 25</span>
</header>
<div class="wrap">
  <div class="progress"><div id="bar"></div></div>
  <div id="main"></div>
  <div class="foot"><button class="big gray" id="startOver" type="button">↺ Start over</button></div>
</div>
<script>// ---- Results reporting: when a quiz/test/race ends, send Dad a short summary (score + what was missed). ----
// Settings come from /workspace/practice/reporting/config.json at build time (build.py fills in CFG below).
// Empty url = feature OFF: nothing is shown, nothing is stored, nothing is sent.
// Sent with fetch(no-cors) to Derek's Google Apps Script web app, which emails him. If the send fails
// (offline), the summary is queued in localStorage and retried the next time any practice page opens.
var Report=(function(){
  "use strict";
  var CFG={"url":"","token":"","to":"","showMailto":"onFail"};
  var QKEY="practiceReportQueue_v1",MAXQ=25,TIMEOUT=15000;
  var on=!!(CFG&&CFG.url),kid="",page="",flushing=false;
  var log=window.__reportLog=[];
  function clip(s,n){s=s==null?"":String(s);return s.length>n?s.slice(0,n-1)+"…":s;}
  function uid(){return Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,10);}
  function loadQ(){try{var q=JSON.parse(localStorage.getItem(QKEY)||"[]");return Array.isArray(q)?q:[];}catch(e){return [];}}
  function saveQ(q){try{q=q.slice(-MAXQ);if(q.length)localStorage.setItem(QKEY,JSON.stringify(q));else localStorage.removeItem(QKEY);}catch(e){}}
  function enqueue(p){var q=loadQ().filter(function(x){return x&&x.id!==p.id;});q.push(p);saveQ(q);log.push("queued:"+p.id);}
  function dequeue(id){saveQ(loadQ().filter(function(x){return x&&x.id!==id;}));}
  function niceTime(d){
    try{return d.toLocaleString("en-US",{weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});}
    catch(e){return d.toString();}
  }
  function dur(s){s=Math.max(0,Math.round(s||0));var m=Math.floor(s/60);return (m?m+" min ":"")+(s%60)+" s";}
  // r: {mode, score, total (null for the race), round, startedAt (ms), missed:[{item,typed,correct,skill}]}
  function build(r){
    var total=(r.total==null)?null:Math.max(0,Math.round(+r.total)||0),score=Math.max(0,Math.round(+r.score)||0),now=new Date();
    var missed=(r.missed||[]).slice(0,60).map(function(m){
      return {item:clip(m.item,160),typed:clip(m.typed,80),correct:clip(m.correct,200),skill:clip(m.skill,120)};});
    return {token:CFG.token||"",id:uid(),kid:kid,page:page,mode:clip(r.mode,80),round:Math.max(1,Math.round(+r.round)||1),
      score:score,total:total,percent:total?Math.round(100*score/total):null,
      durationSec:r.startedAt?Math.round((now.getTime()-r.startedAt)/1000):null,
      missed:missed,finishedAt:now.toISOString(),finishedLocal:niceTime(now)};
  }
  function headline(p){
    return p.kid+" finished "+p.mode+(p.round>1?" (redo round)":"")+": "+
      (p.total==null?p.score+" correct in 60 seconds":p.score+"/"+p.total+(p.percent!=null?" ("+p.percent+"%)":""));
  }
  function summaryText(p){
    var L=[headline(p),"Page: "+p.page,"Finished: "+p.finishedLocal+(p.durationSec!=null?"  ·  Time: "+dur(p.durationSec):""),""];
    if(p.missed.length){
      L.push("Missed ("+p.missed.length+"):");
      p.missed.forEach(function(m){L.push("- "+m.item+" | typed: "+(m.typed||"(blank)")+" | correct: "+m.correct+(m.skill?" | skill: "+m.skill:""));});
      var sk=[];p.missed.forEach(function(m){if(m.skill&&sk.indexOf(m.skill)<0)sk.push(m.skill);});
      if(sk.length){L.push("");L.push("Skills to practice: "+sk.join("; "));}
    }else L.push(p.total==null?"(Race mode: no misses recorded.)":"Nothing missed. Perfect!");
    var t=L.join("\n");
    return t.length>1600?t.slice(0,1590)+"\n…(cut short)":t;
  }
  function mailto(p){
    return "mailto:"+String(CFG.to||"").replace(/[^A-Za-z0-9.@_+-]/g,"")+"?subject="+encodeURIComponent(headline(p))+"&body="+encodeURIComponent(summaryText(p));
  }
  function post(p){
    if(!on) return Promise.reject(new Error("off"));
    if(typeof fetch!=="function") return Promise.reject(new Error("no fetch"));
    var body=JSON.stringify(Object.assign({},p,{token:CFG.token||""}));
    var req=fetch(CFG.url,{method:"POST",mode:"no-cors",cache:"no-store",headers:{"Content-Type":"text/plain;charset=utf-8"},body:body});
    var to=new Promise(function(_,rej){setTimeout(function(){rej(new Error("timeout"));},TIMEOUT);});
    return Promise.race([req,to]).then(function(){log.push("sent:"+p.id);});
  }
  function flush(){
    if(!on||flushing) return Promise.resolve(0);
    var q=loadQ();if(!q.length) return Promise.resolve(0);
    flushing=true;var n=0;log.push("flush:"+q.length);
    return q.reduce(function(chain,p){
      return chain.then(function(){return post(p).then(function(){dequeue(p.id);n++;},function(){log.push("retry-failed:"+p.id);});});
    },Promise.resolve()).then(function(){flushing=false;return n;});
  }
  // Call at the end screen: builds the payload, adds a small status line (+ fallback mail button) into `card`, sends it.
  function finish(r,card){
    if(!on) return null;
    var p;try{p=build(r);}catch(e){log.push("build-error:"+e);return null;}
    window.__lastReport=p;
    var box=document.createElement("div");box.className="report-box";box.id="reportBox";
    box.style.cssText="margin-top:14px;font-size:18px;color:#5b6b7d;text-align:center;font-weight:normal";
    var st=document.createElement("div");st.id="reportStatus";st.textContent="Sending results to Dad…";box.appendChild(st);
    var a=document.createElement("a");a.id="reportMail";a.href=mailto(p);a.textContent="✉️ Send results to Dad";
    a.style.cssText="display:"+(CFG.showMailto==="always"?"inline-block":"none")+";margin-top:8px;background:#7a8899;color:#fff;text-decoration:none;border-radius:14px;padding:8px 18px;font-size:18px;font-weight:bold";
    box.appendChild(a);
    if(card) card.appendChild(box);
    post(p).then(function(){st.textContent="Results sent to Dad ✓";st.style.color="#2e8b57";flush();},
      function(e){enqueue(p);log.push("send-failed:"+(e&&e.message));
        st.textContent="No internet right now. Results saved; they'll go to Dad next time this page opens.";st.style.color="#b0641a";
        a.style.display="inline-block";});
    return p;
  }
  function init(o){kid=o.kid;page=o.page;}
  if(on){
    setTimeout(flush,1500);
    window.addEventListener("online",function(){flush();});
  }
  window.__report={cfg:CFG,queue:loadQ,flush:flush,build:build,mailto:mailto,summaryText:summaryText,headline:headline,QKEY:QKEY};
  return {init:init,finish:finish,flush:flush,enabled:on};
})();
</script>
<script>
(function(){
"use strict";
// ---------- Skill how-tos (from the study guide) ----------
var SKILLS={
1:"Multiplication facts",2:"Factors and factor pairs",3:"Rounding to the nearest thousand",4:"Comparing and ordering big numbers",
5:"Adding and subtracting big numbers",6:"Multiplying in parts (distributive property)",7:"Division with remainders",
8:"“Times as many” number sentences",9:"Place value",10:"Equivalent fractions and comparing fractions",
11:"Unit conversions (length and money)",12:"Geometry words and perimeter",13:"Word problems"};

// ---------- Answer normalizing ----------
// Removes commas, spaces, $ and unit words ("ft", "inches", "boxes", "quarters"...), then reads the number.
function toNum(s){
  if(s==null) return NaN;
  s=String(s).toLowerCase().replace(/[\u00a0\s,$]/g,"");
  s=s.replace(/^(about|=)+/,"");
  s=s.replace(/[a-z°'".]+$/,"");      // trailing units: ft, in., inches, boxes, °, lb ...
  s=s.replace(/^[a-z]+(?=\d)/,"");     // leading word, e.g. "is72" (rare)
  if(!/^-?\d+(\.\d+)?$/.test(s)) return NaN;
  return parseFloat(s);
}
function ints(s){ return (String(s).replace(/(\d),(?=\d{3}\b)/g,"$1").match(/\d+/g)||[]).map(Number); }
function factorPairs(n){var p=[];for(var a=1;a*a<=n;a++) if(n%a===0) p.push([a,n/a]);return p;}
function checkPairs(s,n){
  var nums=ints(s); if(!nums.length) return false;
  var want=factorPairs(n), wantKeys=want.map(function(p){return p[0]+"x"+p[1];}).sort().join("|");
  // a) typed as pairs: 1x12, 2x6, 3x4 (any order, either way round)
  if(nums.length%2===0){
    var keys={},bad=false;
    for(var i=0;i<nums.length;i+=2){var a=nums[i],b=nums[i+1];if(a*b!==n){bad=true;break;}keys[Math.min(a,b)+"x"+Math.max(a,b)]=1;}
    if(!bad && Object.keys(keys).sort().join("|")===wantKeys && nums.length===want.length*2) return true;
  }
  // b) typed as a list of all the factors: 1, 2, 3, 4, 6, 12
  var allF=[];want.forEach(function(p){allF.push(p[0]);if(p[1]!==p[0])allF.push(p[1]);});
  var u=nums.slice().sort(function(x,y){return x-y;}).filter(function(v,i,a){return i===0||a[i-1]!==v;});
  return u.length===nums.length && u.join(",")===allF.sort(function(x,y){return x-y;}).join(",");
}
function num(ans,o){o=o||{};o.type="num";o.ok=function(v){var x=toNum(v);return !isNaN(x)&&[].concat(ans).indexOf(x)>=0;};return o;}
function pick(options,ans,o){o=o||{};o.type="choice";o.options=options;o.ok=function(v){return v===ans;};return o;}
function pairs(n,o){o=o||{};o.type="text";o.ok=function(v){return checkPairs(v,n);};return o;}

// fraction bar picture for #19
function bar(parts,shaded,w,y){var s="",pw=w/parts;for(var i=0;i<parts;i++)s+='<rect x="'+(4+i*pw)+'" y="'+y+'" width="'+pw+'" height="34" fill="'+(i<shaded?"#f2a33a":"#fff")+'" stroke="#334" stroke-width="2"/>';return s;}
function model(a,b,c,d,w2){w2=w2||300;return '<svg viewBox="0 0 310 86" width="310" height="86" aria-hidden="true">'+bar(a,b,300,4)+bar(c,d,w2,48)+'</svg>';}

// ---------- The 25 practice-test problems ----------
var Q=[
{n:1,s:1,q:"8 × 9 = ?",f:[num(72)],
 hint:"Trick for 9s: hold up 10 fingers and fold down finger number 8. Count the fingers on the left (tens) and on the right (ones).",ans:"72"},
{n:2,s:2,q:"In 4 × 7 = 28, which numbers are the factors, and which number is the product?",
 f:[{type:"num",pre:"Factors:",cls:"small"},{type:"num",pre:"and",cls:"small"},{type:"num",pre:"Product:",cls:"small",row:true}],
 check:function(v){var a=toNum(v[0]),b=toNum(v[1]),p=toNum(v[2]);var fa=(a===4&&b===7)||(a===7&&b===4);return [fa,fa,p===28];},
 hint:"The numbers you multiply are the factors. The answer you get is the product.\nIn 2 × 3 = 6, the factors are 2 and 3, and the product is 6.",ans:"Factors: 4 and 7. Product: 28."},
{n:3,s:2,q:"List all the factor pairs for 12.",f:[pairs(12,{cls:"wide",ph:"like: 1 x 12, 2 x …"})],tip:"Type each pair, like 1 x 12, 2 x 6 … (or list all the factors).",
 hint:"Start with 1 × 12. Then try 2, 3, 4 … Does it go in exactly? Stop when the pairs start to repeat.",ans:"1 × 12, 2 × 6, 3 × 4"},
{n:4,s:2,q:"List all the factor pairs for 20.",f:[pairs(20,{cls:"wide",ph:"like: 1 x 20, …"})],tip:"Type each pair, like 1 x 20, 2 x 10 … (or list all the factors).",
 hint:"Start with 1 × 20. Then try 2, 3, 4, 5 … (3 doesn’t go in exactly!). Stop when the pairs start to repeat.",ans:"1 × 20, 2 × 10, 4 × 5"},
{n:5,s:3,q:"Round 3,509 to the nearest thousand.",f:[pick(["a) 3,000","b) 3,500","c) 4,000","d) 3,510"],"c) 4,000",{vert:false})],
 hint:"Look at the hundreds digit (the neighbor to the right of the thousands). 5 or more, raise the score. 4 or less, let it rest. Then change the rest of the digits to 0.",ans:"c) 4,000 (the hundreds digit is 5, so round up)"},
{n:6,s:4,q:"52,614  ___  52,641",f:[pick(["<",">","="],"<",{sym:true})],tip:"Tap <, > or =.",
 hint:"Line them up and compare digit by digit from the left. The first place where the digits are different tells you which is bigger. The open mouth eats the bigger number.",ans:"52,614 < 52,641 (tens place: 1 < 4)"},
{n:7,s:4,q:"Put these numbers in order from greatest to least:  7,425   7,452   7,405",
 f:[num(7452,{pre:"Greatest:",row:true}),num(7425,{pre:"Next:",row:true}),num(7405,{pre:"Least:",row:true})],
 hint:"All three start with 7, 4. Look at the tens place to see which is biggest.",ans:"7,452; 7,425; 7,405"},
{n:8,s:5,q:"64,739 + 28,586 = ?",f:[num(93325,{cls:"wide"})],
 hint:"Line up the ones, tens, hundreds … Start on the right. If a column adds up to 10 or more, write the ones digit and carry the 1.",ans:"93,325"},
{n:9,s:5,q:"6,000 − 2,847 = ?",f:[num(3153,{cls:"wide"})],
 hint:"Borrow across the zeros, starting from the left. Check by adding: your answer + 2,847 should equal 6,000.",ans:"3,153 (check: 3,153 + 2,847 = 6,000)"},
{n:10,s:6,q:"Use the distributive property to multiply 238 × 4. Multiply 4 by all the values in 238 (200 + 30 + 8).",
 f:[num(800,{pre:"200 × 4 =",row:true}),num(120,{pre:"30 × 4 =",row:true}),num(32,{pre:"8 × 4 =",row:true}),num(952,{pre:"Add them up: 238 × 4 =",row:true})],
 hint:"Multiply each part by 4, then add the parts together.\nExample: 346 × 4 → 1,200 + 160 + 24 = 1,384.",ans:"800 + 120 + 32 = 952"},
{n:11,s:6,q:"Use the distributive property: 615 × 3 = ?  (600 + 10 + 5)",
 f:[num(1800,{pre:"600 × 3 =",row:true}),num(30,{pre:"10 × 3 =",row:true}),num(15,{pre:"5 × 3 =",row:true}),num(1845,{pre:"Add them up: 615 × 3 =",row:true})],
 hint:"Multiply each part by 3, then add the parts together.",ans:"1,800 + 30 + 15 = 1,845"},
{n:12,s:7,q:"29 ÷ 4 = ?  (There will be a remainder.)",f:[num(7,{cls:"small"}),num(1,{pre:"R",cls:"small"})],
 hint:"What times 4 gets as close to 29 as possible without going over? The amount left over is the remainder. It must be smaller than 4.",ans:"7 R1 (4 × 7 = 28, 1 left over)"},
{n:13,s:7,q:"50 ÷ 8 = ?  (There will be a remainder.)",f:[num(6,{cls:"small"}),num(2,{pre:"R",cls:"small"})],
 hint:"What times 8 gets as close to 50 as possible without going over? The amount left over is the remainder. It must be smaller than 8.",ans:"6 R2 (8 × 6 = 48, 2 left over)"},
{n:14,s:8,q:"Write and solve a number sentence for five times as many as 6.",
 f:[{type:"num",cls:"small"},{type:"num",pre:"×",cls:"small"},{type:"num",pre:"=",cls:"small"}],
 check:function(v){var a=toNum(v[0]),b=toNum(v[1]),c=toNum(v[2]);var ok=(a===5&&b===6)||(a===6&&b===5);return [ok,ok,c===30];},
 hint:"“Five times as many as 6” means 5 groups of 6. Write it as number × number = answer.\nExample: seven times as many as 4 → 7 × 4 = 28.",ans:"5 × 6 = 30"},
{n:15,s:9,q:"Write 4,000 + 700 + 50 + 3 as a base-ten number.",f:[num(4753,{cls:"wide"})],
 hint:"Put each digit in its place: thousands, hundreds, tens, ones.\nExample: 6,000 + 400 + 20 + 7 = 6,427.",ans:"4,753"},
{n:16,s:9,q:"In the number 5,550, the 5 in the hundreds place is worth ___ times the 5 in the tens place.",f:[num(10,{cls:"small",post:"times"})],
 hint:"The 5 in the hundreds place is worth 500. The 5 in the tens place is worth 50. Each place is worth 10 times the place to its right.",ans:"10 (500 is 10 × 50)"},
{n:17,s:11,q:"If 1 yd = 3 ft, then 5 yd = ___ ft.",f:[num(15,{post:"ft"})],
 hint:"Going from a bigger unit (yards) to a smaller unit (feet)? Multiply. Each yard is 3 feet.",ans:"15 ft (5 × 3)"},
{n:18,s:11,q:"Ben’s kite string is 2 yards long. How many inches long is it?",f:[num(72,{post:"inches"})],
 hint:"1 yard = 36 inches. Going from a bigger unit to a smaller unit? Multiply.",ans:"72 inches (2 × 36)"},
{n:19,s:10,q:"Fill in the blank so the fractions are equivalent:  1/2 = ___/6.  Then tap the fraction model that shows it.",
 f:[num(3,{pre:"1/2 =",post:"/6",cls:"small",row:true}),
    pick(["A","B","C"],"A",{row:true,vert:true,labels:[
      "A "+model(2,1,6,3),
      "B "+model(2,1,6,2),
      "C "+model(2,1,6,3,180)]})],
 hint:"One half is when the top number is half of the bottom number. Half of 6 is …?\nFor the model: the two bars must be the SAME size, and the shaded parts must cover the same amount.",
 ans:"1/2 = 3/6. Model A: a bar split into 2 with 1 part shaded, and a bar of the same size split into 6 with 3 parts shaded. (C is wrong because the bars are not the same size.)"},
{n:20,s:10,q:"5/8  ___  1/2   (Hint: think of a number line.)",f:[pick(["<",">","="],">",{sym:true})],tip:"Tap <, > or =.",
 hint:"1/2 is the same as 4/8. On a number line, the fraction farther to the right is greater. Is 5/8 to the right or left of 4/8?",ans:"5/8 > 1/2 (1/2 = 4/8, and 5/8 is farther right)"},
{n:21,s:13,q:"Maria has 52 marbles. That is 18 more than Sam has. How many marbles does Sam have? Choose the correct equation and solve it.",
 f:[pick(["a) 52 + 18 = ?","b) 52 − 18 = ?","c) 18 − 52 = ?"],"b) 52 − 18 = ?",{row:true}),num(34,{pre:"Sam has",post:"marbles",row:true})],
 hint:"“That is 18 more than Sam” means Maria has the bigger number. To find the smaller one, subtract: big number − the “more” amount.",ans:"b) 52 − 18 = 34 marbles"},
{n:22,s:13,q:"A bakery sold 412 muffins on Monday, 189 on Tuesday, 305 on Wednesday, and 96 on Thursday. Did they sell more or fewer than 900 muffins? (Round to the highest place value.)",
 f:[num(1000,{pre:"Rounded total:",row:true}),pick(["More than 900","Fewer than 900"],"More than 900",{row:true})],
 hint:"Round each number to its highest place value: 412 → 400, 189 → 200, 305 → 300, 96 → 100. Add them, then compare with 900.",ans:"400 + 200 + 300 + 100 = 1,000, so MORE than 900 (the exact total is 1,002)."},
{n:23,s:11,q:"Jake needs $5.00 in quarters for the arcade. He has 7 quarters. How many more quarters does he need?",f:[num(13,{post:"quarters"})],
 hint:"$1.00 = 4 quarters, so $5.00 = 5 × 4 quarters. Then take away the 7 he already has.",ans:"$5.00 = 20 quarters, and 20 − 7 = 13 quarters"},
{n:24,s:12,q:"Which one has one endpoint and goes on forever in one direction?",f:[pick(["a) line segment","b) ray","c) line","d) point"],"b) ray",{vert:true})],
 hint:"Line segment: two endpoints. Line: arrows on both ends, goes on forever both ways. Ray: starts at one endpoint and goes on forever (one arrow).",ans:"b) ray"},
{n:25,s:12,q:"A square has sides that are each 6 inches long. What is its perimeter?",f:[num(24,{post:"inches"})],
 hint:"Perimeter = the distance all the way around. A square has 4 equal sides. Add up all the sides.",ans:"6 + 6 + 6 + 6 = 24 inches"}
];

// ---------- State ----------
var state; // {order:[idx], pos, score, missed:{}, round, typed:{n:first wrong answer}, t0}
Report.init({kid:"Eli",page:"Math Practice Test #5 (Simple Solutions)"});
var main=document.getElementById("main");
function fresh(order,round){state={order:order,pos:0,score:0,missed:[],round:round||1,tries:0,done:false,revealed:false,typed:{},t0:Date.now()};render();}
function all(){return Q.map(function(_,i){return i;});}

function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function updateTop(){
  var total=state.order.length;
  document.getElementById("score").textContent="⭐ "+state.score+(state.round>1?" (redo)":"");
  document.getElementById("where").textContent=Math.min(state.pos+1,total)+" / "+total;
  document.getElementById("bar").style.width=(100*state.pos/total)+"%";
}

var inputs=[]; // per field: {get(), mark(ok), el}
function render(){
  updateTop();
  main.innerHTML="";
  if(state.pos>=state.order.length) return renderEnd();
  var q=Q[state.order[state.pos]];
  state.tries=0;state.done=false;state.revealed=false;
  var card=el("div","card");card.id="qcard";
  card.appendChild(el("span","qnum","#"+q.n));
  card.appendChild(el("span","skill","Skill "+q.s+": "+SKILLS[q.s]));
  card.appendChild(el("div","qtext",q.q));
  var fw=el("div","fields");inputs=[];
  q.f.forEach(function(f,fi){
    var w=el("div","field"+(f.row?" row":""));
    if(f.pre) w.appendChild(el("span",null,f.pre));
    if(f.type==="choice"){
      var box=el("div","choices"+(f.vert?" vert":""));var val=null;var bs=[];
      f.options.forEach(function(o,oi){
        var b=el("button","ch"+(f.sym?" sym":""),f.labels?f.labels[oi]:o);b.type="button";b.setAttribute("data-val",o);
        b.addEventListener("click",function(){if(state.done)return;val=o;bs.forEach(function(x){x.classList.remove("sel","bad");});b.classList.add("sel");});
        bs.push(b);box.appendChild(b);
      });
      w.appendChild(box);if(f.vert||f.labels) w.classList.add("row");
      inputs.push({get:function(){return val;},mark:function(ok){bs.forEach(function(x){x.classList.remove("ok","bad");if(x.getAttribute("data-val")===val&&val!=null)x.classList.add(ok?"ok":"bad");});},focus:function(){}});
    }else{
      var inp=el("input","ans"+(f.cls?" "+f.cls:""));
      inp.type="text";inp.setAttribute("autocomplete","off");inp.setAttribute("autocorrect","off");inp.setAttribute("autocapitalize","off");inp.spellcheck=false;
      if(f.type==="num") inp.setAttribute("inputmode","decimal");
      if(f.ph) inp.placeholder=f.ph;
      inp.setAttribute("aria-label","answer "+(fi+1));
      inp.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();if(!state.done)doCheck();else next();}});
      inp.addEventListener("input",function(){inp.classList.remove("bad");});
      w.appendChild(inp);
      inputs.push({get:function(){return inp.value;},mark:function(ok){inp.classList.remove("ok","bad");inp.classList.add(ok?"ok":"bad");if(ok)inp.readOnly=state.done;},focus:function(){inp.focus();},inp:inp});
    }
    if(f.post) w.appendChild(el("span",null,f.post));
    fw.appendChild(w);
  });
  card.appendChild(fw);
  if(q.tip) card.appendChild(el("div","tip",q.tip));
  var fb=el("div","feedback");fb.id="fb";card.appendChild(fb);
  var btns=el("div","btns");
  var cb=el("button","big check","✔ Check");cb.type="button";cb.id="checkBtn";cb.addEventListener("click",doCheck);
  var sb=el("button","big show","👀 Show answer");sb.type="button";sb.id="showBtn";sb.style.display="none";sb.addEventListener("click",reveal);
  var nb=el("button","big next",(state.pos+1>=state.order.length?"Finish 🏁":"Next ➜"));nb.type="button";nb.id="nextBtn";nb.style.display="none";nb.addEventListener("click",next);
  btns.appendChild(cb);btns.appendChild(sb);btns.appendChild(nb);card.appendChild(btns);
  main.appendChild(card);
  // focus the first text box on laptops (not on touch screens, to avoid the keyboard jumping up)
  if(!("ontouchstart" in window)&&inputs[0]&&inputs[0].inp) inputs[0].focus();
  window.scrollTo(0,0);
}

function doCheck(){
  if(state.done) return;
  var q=Q[state.order[state.pos]];
  var vals=inputs.map(function(i){return i.get();});
  var fb=document.getElementById("fb");
  if(vals.some(function(v){return v==null||String(v).trim()==="";})){
    fb.className="feedback wrong";fb.innerHTML="<b class='t'>✏️ Fill in every answer first.</b>";return;
  }
  var res=q.check?q.check(vals):q.f.map(function(f,i){return f.ok(vals[i]);});
  var allOk=res.every(Boolean);
  state.tries++;
  if(allOk){
    state.done=true;
    if(state.tries===1&&!state.revealed){state.score++;}
    res.forEach(function(r,i){inputs[i].mark(true);});
    var praise=["Awesome!","You got it!","Great job!","Super!","Nailed it!","Math star!"][Math.floor(Math.random()*6)];
    fb.className="feedback right";
    fb.innerHTML="<b class='t'>✅ "+praise+"</b>"+(state.tries>1?"Nice fixing! (This one counts as a miss, so you can practice it again.)":"");
    celebrate();
    document.getElementById("checkBtn").style.display="none";document.getElementById("showBtn").style.display="none";
    document.getElementById("nextBtn").style.display="";
    updateTop();
  }else{
    if(state.tries===1){markMissed(q.n);if(state.typed[q.n]==null) state.typed[q.n]=typedText(q,vals);}
    res.forEach(function(r,i){inputs[i].mark(r);});
    fb.className="feedback wrong";
    fb.innerHTML="<b class='t'>🤔 Not quite. Try again!</b><div class='hint'><b>Hint:</b> "+q.hint+"</div>";
    var c=document.getElementById("qcard");c.classList.remove("shake");void c.offsetWidth;c.classList.add("shake");
    document.getElementById("showBtn").style.display="";
    document.getElementById("nextBtn").style.display="";
  }
}
// what Eli entered on his first (wrong) try, e.g. "Factors: 4; and 7; Product: 27"
function typedText(q,vals){
  return vals.map(function(v,i){var f=q.f[i]||{};return (vals.length>1&&f.pre?f.pre+" ":"")+String(v==null?"":v).trim()+(f.post&&vals.length>1?(f.post.charAt(0)==="/"?"":" ")+f.post:"");}).join("; ");
}
function markMissed(n){if(state.missed.indexOf(n)<0)state.missed.push(n);}
function reveal(){
  var q=Q[state.order[state.pos]];state.revealed=true;markMissed(q.n);
  var fb=document.getElementById("fb");
  if(!fb.querySelector(".answer")) fb.insertAdjacentHTML("beforeend","<span class='answer'><b>Answer:</b> "+q.ans+"</span>");
  fb.className="feedback wrong";
  document.getElementById("nextBtn").style.display="";
}
function next(){
  var q=Q[state.order[state.pos]];
  if(!state.done){markMissed(q.n);if(state.typed[q.n]==null) state.typed[q.n]="(skipped)";} // skipped or not solved
  state.pos++;render();
}
function renderEnd(){
  var total=state.order.length,s=state.score;
  document.getElementById("bar").style.width="100%";
  var pct=s/total,stars=pct===1?"⭐⭐⭐":pct>=.8?"⭐⭐":pct>=.5?"⭐":"💪";
  var card=el("div","card end");card.id="endCard";
  card.innerHTML="<div class='stars'>"+stars+"</div><h2 style='margin:4px 0'>"+(state.round>1?"Redo round done!":"Practice test done!")+"</h2>"+
   "<div class='score' id='finalScore'>"+s+" / "+total+"</div>"+
   "<div>"+(pct===1?"Perfect! Every one right on the first try! 🎉":pct>=.8?"Great work! Just a few to practice.":"Good effort! Let's practice the ones you missed.")+"</div>";
  var missed=state.missed.slice().sort(function(a,b){return a-b;});
  if(missed.length){
    card.appendChild(el("div",null,"<br>Problems to practice:"));
    var ch=el("div","chips");missed.forEach(function(n){ch.appendChild(el("span","chip","#"+n+" · "+SKILLS[Q[n-1].s]));});card.appendChild(ch);
  }
  var btns=el("div","btns");btns.style.justifyContent="center";
  if(missed.length){var t=el("button","big check","🔁 Try missed ones again");t.type="button";t.id="retryBtn";
    t.addEventListener("click",function(){fresh(missed.map(function(n){return n-1;}),state.round+1);});btns.appendChild(t);}
  var r=el("button","big restart","↺ Start over (all 25)");r.type="button";r.addEventListener("click",function(){fresh(all(),1);});btns.appendChild(r);
  card.appendChild(btns);main.appendChild(card);
  Report.finish({mode:"Math Practice Test #5",round:state.round,score:s,total:total,startedAt:state.t0,
    missed:missed.map(function(n){var q=Q[n-1];return {item:"#"+n+": "+q.q,typed:state.typed[n]||"",correct:q.ans,skill:"Skill "+q.s+": "+SKILLS[q.s]};})},card);
  if(pct>=.8) {celebrate();setTimeout(celebrate,350);}
}
function celebrate(){
  var icons=["⭐","🌟","✨","🎉","💫"];var cx=window.innerWidth/2,cy=window.innerHeight/2.5;
  for(var i=0;i<16;i++){var s=el("span","burst",icons[i%icons.length]);var a=Math.random()*Math.PI*2,d=120+Math.random()*200;
    s.style.left=cx+"px";s.style.top=cy+"px";s.style.setProperty("--dx",Math.cos(a)*d+"px");s.style.setProperty("--dy",Math.sin(a)*d+"px");
    document.body.appendChild(s);(function(x){setTimeout(function(){x.remove();},1100);})(s);}
}
document.getElementById("startOver").addEventListener("click",function(){if(state.pos===0||confirm("Start over from problem #1?"))fresh(all(),1);});
// expose for testing
window.__practice={Q:Q,toNum:toNum,checkPairs:checkPairs,state:function(){return state;}};
fresh(all(),1);
})();
</script>
