:root{--blue:#2a6fb0;--green:#2e8b57;--orange:#e07b1f;--purple:#7b4fa3;--red:#d64545;--bg:#eef6ff;--card:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:"Andika","Trebuchet MS","Segoe UI",system-ui,sans-serif;background:linear-gradient(160deg,#dff0ff,#fdf3e1);color:#1d2a3a;min-height:100vh;font-size:24px;line-height:1.35}
header{background:var(--blue);color:#fff;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:5;box-shadow:0 3px 8px rgba(0,0,0,.15)}
header h1{font-size:26px;margin:0;flex:1;min-width:220px}
.pill{background:rgba(255,255,255,.2);border-radius:999px;padding:6px 14px;font-weight:bold;font-size:20px;white-space:nowrap}
.wrap{max-width:900px;margin:0 auto;padding:16px}
.progress{height:16px;background:#cfe0f2;border-radius:10px;overflow:hidden;margin:4px 0 14px}
.progress div{height:100%;background:linear-gradient(90deg,#33b36b,#7bd88f);width:0;transition:width .3s}
.card{background:var(--card);border-radius:22px;padding:22px 24px;box-shadow:0 6px 18px rgba(30,60,100,.13);position:relative}
.qnum{display:inline-block;background:var(--orange);color:#fff;font-weight:bold;border-radius:14px;padding:4px 14px;font-size:22px}
.skill{color:var(--purple);font-size:18px;font-weight:bold;margin-left:8px}
.qtext{font-size:30px;margin:14px 0 18px;font-weight:bold}
.fields{display:flex;flex-wrap:wrap;gap:14px 18px;align-items:center}
.field{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:28px}
.field.row{flex-basis:100%}
input.ans{font:inherit;font-size:30px;padding:8px 12px;border:3px solid #9bb7d4;border-radius:14px;width:190px;min-height:60px;background:#fbfdff;color:#123}
input.ans.wide{width:min(520px,100%)}
input.ans.small{width:110px}
input.ans:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px rgba(42,111,176,.2)}
.ok input.ans,input.ans.ok{border-color:var(--green);background:#e9f8ef}
input.ans.bad{border-color:var(--red);background:#fdeeee}
.choices{display:flex;gap:12px;flex-wrap:wrap}
.choices.vert{flex-direction:column;align-items:stretch;width:100%}
button{font:inherit;cursor:pointer;border:none;border-radius:16px;touch-action:manipulation}
.ch{background:#eef3fa;border:3px solid #9bb7d4;font-size:28px;min-width:76px;min-height:64px;padding:8px 18px;color:#123;text-align:left}
.ch.sym{font-size:38px;font-weight:bold;text-align:center;min-width:90px}
.ch.sel{background:#dbe9ff;border-color:var(--blue);box-shadow:0 0 0 4px rgba(42,111,176,.2)}
.ch.ok{background:#e9f8ef;border-color:var(--green)}
.ch.bad{background:#fdeeee;border-color:var(--red)}
.ch svg{display:block;margin-top:6px;max-width:100%}
.btns{display:flex;gap:14px;flex-wrap:wrap;margin-top:22px}
.big{font-size:28px;font-weight:bold;padding:14px 28px;min-height:66px;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.check{background:var(--green)}.next{background:var(--blue)}.show{background:var(--purple)}.restart{background:var(--orange)}.gray{background:#7a8899}
.big[disabled]{opacity:.45}
.feedback{margin-top:18px;border-radius:16px;padding:14px 18px;font-size:24px;display:none}
.feedback.right{display:block;background:#e3f7ea;border:3px solid var(--green)}
.feedback.wrong{display:block;background:#fff4e0;border:3px solid var(--orange)}
.feedback b.t{font-size:30px;display:block;margin-bottom:6px}
.hint{white-space:pre-line}
.answer{display:block;margin-top:10px;background:#f3ecfb;border-radius:12px;padding:10px 14px;border:2px dashed var(--purple)}
.tip{font-size:18px;color:#5b6b7d;margin-top:8px}
.end{text-align:center}
.end .score{font-size:72px;font-weight:bold;color:var(--green);margin:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0}
.chip{background:#fdeeee;border:2px solid var(--red);border-radius:999px;padding:4px 14px;font-size:22px}
.stars{font-size:46px}
.burst{position:fixed;pointer-events:none;z-index:50;font-size:34px;animation:fly 1s ease-out forwards}
@keyframes fly{0%{transform:translate(0,0) scale(.5);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.2) rotate(200deg);opacity:0}}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.foot{text-align:center;margin-top:16px}
@media (max-width:600px){body{font-size:20px}.qtext{font-size:25px}header h1{font-size:21px}input.ans{width:150px}}
</style>
</head>

      inp.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();if(!state.done)doCheck();else next();}});
      inp.addEventListener("input",function(){inp.classList.remove("bad");});
      w.appendChild(inp);
      inputs.push({get:function(){return inp.value;},mark:function(ok){inp.classList.remove("ok","bad");inp.classList.add(ok?"ok":"bad");if(ok)inp.readOnly=state.done;},focus:function(){inp.focus();},inp:inp});
    }
    if(f.post) w.appendChild(el("span",null,f.post));
    fw.appendChild(w);
  });
  card.appendChild(fw);
  if(q.tip) card.appendChild(el("div","tip",q.tip));
  var fb=el("div","feedback");fb.id="fb";card.appendChild(fb);
  var btns=el("div","btns");
  var cb=el("button","big check","✔ Check");cb.type="button";cb.id="checkBtn";cb.addEventListener("click",doCheck);
  var sb=el("button","big show","👀 Show answer");sb.type="button";sb.id="showBtn";sb.style.display="none";sb.addEventListener("click",reveal);
  var nb=el("button","big next",(state.pos+1>=state.order.length?"Finish 🏁":"Next ➜"));nb.type="button";nb.id="nextBtn";nb.style.display="none";nb.addEventListener("click",next);
  btns.appendChild(cb);btns.appendChild(sb);btns.appendChild(nb);card.appendChild(btns);
  main.appendChild(card);
  // focus the first text box on laptops (not on touch screens, to avoid the keyboard jumping up)
  if(!("ontouchstart" in window)&&inputs[0]&&inputs[0].inp) inputs[0].focus();
  window.scrollTo(0,0);
}

function doCheck(){
  if(state.done) return;
  var q=Q[state.order[state.pos]];
  var vals=inputs.map(function(i){return i.get();});
  var fb=document.getElementById("fb");
  if(vals.some(function(v){return v==null||String(v).trim()==="";})){
    fb.className="feedback wrong";fb.innerHTML="<b class='t'>✏️ Fill in every answer first.</b>";return;
  }
  var res=q.check?q.check(vals):q.f.map(function(f,i){return f.ok(vals[i]);});
  var allOk=res.every(Boolean);
  state.tries++;
  if(!q.extra) Report.answer({key:q.n,q:"#"+q.n+": "+q.q,given:typedText(q,vals),correct:q.ans,ok:allOk&&!state.revealed,skill:"Skill "+q.s+": "+SKILLS[q.s]});
  if(!q._graded){q._graded=true;A.answered(state.order,state.pos,q,allOk&&!state.revealed,typedText(q,vals));}
  if(allOk){
    state.done=true;
    if(state.tries===1&&!state.revealed&&!q.extra){state.score++;}
    res.forEach(function(r,i){inputs[i].mark(true);});
    var praise=["Awesome!","You got it!","Great job!","Super!","Nailed it!","Math star!"][Math.floor(Math.random()*6)];
    fb.className="feedback right";
    fb.innerHTML="<b class='t'>✅ "+praise+"</b>"+(state.tries>1?(q.extra?"Nice fixing!":"Nice fixing! (This one counts as a miss, so you can practice it again.)"):"");
    celebrate();
    document.getElementById("checkBtn").style.display="none";document.getElementById("showBtn").style.display="none";
    document.getElementById("nextBtn").style.display="";
    updateTop();
  }else{
    if(state.tries===1&&!q.extra){markMissed(q.n);if(state.typed[q.n]==null) state.typed[q.n]=typedText(q,vals);}
    res.forEach(function(r,i){inputs[i].mark(r);});
    fb.className="feedback wrong";
    fb.innerHTML="<b class='t'>🤔 Not quite. Try again!</b><div class='hint'><b>Hint:</b> "+q.hint+"</div>";
    var c=document.getElementById("qcard");c.classList.remove("shake");void c.offsetWidth;c.classList.add("shake");
    document.getElementById("showBtn").style.display="";
    document.getElementById("nextBtn").style.display="";
  }
}
// what Eli entered on his first (wrong) try, e.g. "Factors: 4; and 7; Product: 27"
function typedText(q,vals){
  return vals.map(function(v,i){var f=q.f[i]||{};return (vals.length>1&&f.pre?f.pre+" ":"")+String(v==null?"":v).trim()+(f.post&&vals.length>1?(f.post.charAt(0)==="/"?"":" ")+f.post:"");}).join("; ");
}
function markMissed(n){if(state.missed.indexOf(n)<0)state.missed.push(n);}
function reveal(){
  var q=Q[state.order[state.pos]];state.revealed=true;
  if(q.extra){if(!q._graded){q._graded=true;A.answered(state.order,state.pos,q,false,"(tapped Show answer)");}}
  else{markMissed(q.n);Report.answer({key:q.n,q:"#"+q.n+": "+q.q,given:"(tapped Show answer)",correct:q.ans,ok:false,skill:"Skill "+q.s+": "+SKILLS[q.s]});}
  var fb=document.getElementById("fb");
  if(!fb.querySelector(".answer")) fb.insertAdjacentHTML("beforeend","<span class='answer'><b>Answer:</b> "+q.ans+"</span>");
  fb.className="feedback wrong";
  document.getElementById("nextBtn").style.display="";
}
function next(){
  var q=Q[state.order[state.pos]];
  if(!state.done&&q.extra){if(!q._graded){q._graded=true;A.answered(state.order,state.pos,q,false,"(skipped)");}}
  else if(!state.done){markMissed(q.n);if(state.typed[q.n]==null) state.typed[q.n]="(skipped)";Report.answer({key:q.n,q:"#"+q.n+": "+q.q,given:"(skipped)",correct:q.ans,ok:false,skill:"Skill "+q.s+": "+SKILLS[q.s]});} // skipped or not solved
  state.pos++;render();
}
function renderEnd(){
  var total=A.count(state.order),s=state.score;
  document.getElementById("bar").style.width="100%";
  var pct=s/total,stars=pct===1?"⭐⭐⭐":pct>=.8?"⭐⭐":pct>=.5?"⭐":"💪";
  var card=el("div","card end");card.id="endCard";
  card.innerHTML="<div class='stars'>"+stars+"</div><h2 style='margin:4px 0'>"+(state.round>1?"Redo round done!":"Practice test done!")+"</h2>"+
   "<div class='score' id='finalScore'>"+s+" / "+total+"</div>"+
   "<div>"+(pct===1?"Perfect! Every one right on the first try! 🎉":pct>=.8?"Great work! Just a few to practice.":"Good effort! Let's practice the ones you missed.")+"</div>";
  var missed=state.missed.slice().sort(function(a,b){return a-b;});
  if(missed.length){
    card.appendChild(el("div",null,"<br>Problems to practice:"));
    var ch=el("div","chips");missed.forEach(function(n){ch.appendChild(el("span","chip","#"+n+" · "+SKILLS[Q[n-1].s]));});card.appendChild(ch);
  }
  var xs=A.summaryEl();if(xs)card.appendChild(xs);
  var btns=el("div","btns");btns.style.justifyContent="center";
  if(missed.length){var t=el("button","big check","🔁 Try missed ones again");t.type="button";t.id="retryBtn";
    t.addEventListener("click",function(){fresh(missed.map(function(n){return n-1;}),state.round+1);});btns.appendChild(t);}
  var r=el("button","big restart","↺ Start over (all 25)");r.type="button";r.addEventListener("click",function(){fresh(all(),1);});btns.appendChild(r);
  card.appendChild(btns);main.appendChild(card);
  Report.finish({mode:"Math Practice Test #5",round:state.round,score:s,total:total,startedAt:state.t0,
    missed:missed.map(function(n){var q=Q[n-1];return {item:"#"+n+": "+q.q,typed:state.typed[n]||"",correct:q.ans,skill:"Skill "+q.s+": "+SKILLS[q.s]};})},card);
  if(pct>=.8) {celebrate();setTimeout(celebrate,350);}
}
function celebrate(){
  var icons=["⭐","🌟","✨","🎉","💫"];var cx=window.innerWidth/2,cy=window.innerHeight/2.5;
  for(var i=0;i<16;i++){var s=el("span","burst",icons[i%icons.length]);var a=Math.random()*Math.PI*2,d=120+Math.random()*200;
    s.style.left=cx+"px";s.style.top=cy+"px";s.style.setProperty("--dx",Math.cos(a)*d+"px");s.style.setProperty("--dy",Math.sin(a)*d+"px");
    document.body.appendChild(s);(function(x){setTimeout(function(){x.remove();},1100);})(s);}
}
document.getElementById("startOver").addEventListener("click",function(){if(state.pos===0||confirm("Start over from problem #1?"))fresh(all(),1);});
// expose for testing
window.__practice={Q:Q,toNum:toNum,checkPairs:checkPairs,state:function(){return state;},A:A,fresh:fresh,all:all};
fresh(all(),1);
})();
</script>
