:root{--blue:#2a6fb0;--green:#2e8b57;--orange:#e07b1f;--purple:#7b4fa3;--red:#d64545;--bg:#eef6ff;--card:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:"Andika","Trebuchet MS","Segoe UI",system-ui,sans-serif;background:linear-gradient(160deg,#dff0ff,#fdf3e1);color:#1d2a3a;min-height:100vh;font-size:24px;line-height:1.35}
header{background:var(--blue);color:#fff;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:5;box-shadow:0 3px 8px rgba(0,0,0,.15)}
header h1{font-size:26px;margin:0;flex:1;min-width:220px}
.pill{background:rgba(255,255,255,.2);border-radius:999px;padding:6px 14px;font-weight:bold;font-size:20px;white-space:nowrap}
.wrap{max-width:900px;margin:0 auto;padding:16px}
.progress{height:16px;background:#cfe0f2;border-radius:10px;overflow:hidden;margin:4px 0 14px}
.progress div{height:100%;background:linear-gradient(90deg,#33b36b,#7bd88f);width:0;transition:width .3s}
.card{background:var(--card);border-radius:22px;padding:22px 24px;box-shadow:0 6px 18px rgba(30,60,100,.13);position:relative}
.qnum{display:inline-block;background:var(--orange);color:#fff;font-weight:bold;border-radius:14px;padding:4px 14px;font-size:22px}
.skill{color:var(--purple);font-size:18px;font-weight:bold;margin-left:8px}
.qtext{font-size:30px;margin:14px 0 18px;font-weight:bold}
.fields{display:flex;flex-wrap:wrap;gap:14px 18px;align-items:center}
.field{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:28px}
.field.row{flex-basis:100%}
input.ans{font:inherit;font-size:30px;padding:8px 12px;border:3px solid #9bb7d4;border-radius:14px;width:190px;min-height:60px;background:#fbfdff;color:#123}
input.ans.wide{width:min(520px,100%)}
input.ans.small{width:110px}
input.ans:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px rgba(42,111,176,.2)}
.ok input.ans,input.ans.ok{border-color:var(--green);background:#e9f8ef}
input.ans.bad{border-color:var(--red);background:#fdeeee}
.choices{display:flex;gap:12px;flex-wrap:wrap}
.choices.vert{flex-direction:column;align-items:stretch;width:100%}
button{font:inherit;cursor:pointer;border:none;border-radius:16px;touch-action:manipulation}
.ch{background:#eef3fa;border:3px solid #9bb7d4;font-size:28px;min-width:76px;min-height:64px;padding:8px 18px;color:#123;text-align:left}
.ch.sym{font-size:38px;font-weight:bold;text-align:center;min-width:90px}
.ch.sel{background:#dbe9ff;border-color:var(--blue);box-shadow:0 0 0 4px rgba(42,111,176,.2)}
.ch.ok{background:#e9f8ef;border-color:var(--green)}
.ch.bad{background:#fdeeee;border-color:var(--red)}
.ch svg{display:block;margin-top:6px;max-width:100%}
.btns{display:flex;gap:14px;flex-wrap:wrap;margin-top:22px}
.big{font-size:28px;font-weight:bold;padding:14px 28px;min-height:66px;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.check{background:var(--green)}.next{background:var(--blue)}.show{background:var(--purple)}.restart{background:var(--orange)}.gray{background:#7a8899}
.big[disabled]{opacity:.45}
.feedback{margin-top:18px;border-radius:16px;padding:14px 18px;font-size:24px;display:none}
.feedback.right{display:block;background:#e3f7ea;border:3px solid var(--green)}
.feedback.wrong{display:block;background:#fff4e0;border:3px solid var(--orange)}
.feedback b.t{font-size:30px;display:block;margin-bottom:6px}
.hint{white-space:pre-line}
.answer{display:block;margin-top:10px;background:#f3ecfb;border-radius:12px;padding:10px 14px;border:2px dashed var(--purple)}
.tip{font-size:18px;color:#5b6b7d;margin-top:8px}
.end{text-align:center}
.end .score{font-size:72px;font-weight:bold;color:var(--green);margin:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0}
.chip{background:#fdeeee;border:2px solid var(--red);border-radius:999px;padding:4px 14px;font-size:22px}
.stars{font-size:46px}
.burst{position:fixed;pointer-events:none;z-index:50;font-size:34px;animation:fly 1s ease-out forwards}
@keyframes fly{0%{transform:translate(0,0) scale(.5);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.2) rotate(200deg);opacity:0}}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.foot{text-align:center;margin-top:16px}
@media (max-width:600px){body{font-size:20px}.qtext{font-size:25px}header h1{font-size:21px}input.ans{width:150px}}
</style>
</head>

  // focus blips); hidden+blur at the same time = ONE leave. Only while a session is active (after begin, before finish).
  var LEAVE_MIN=1500;
  function isAway(){return document.hidden||(typeof document.hasFocus==="function"&&!document.hasFocus());}
  function awayStart(){
    if(!on||!S||S.done||S.away) return;
    var a=S.away={t:Date.now(),confirmed:false,sess:S};
    a.timer=setTimeout(function(){if(S===a.sess&&S.away===a&&isAway()){a.confirmed=true;log.push("leave-confirmed");
      a.poll=setInterval(function(){if(!isAway()) awayEnd();},1000);} else if(S&&S.away===a) awayEnd();},LEAVE_MIN);
  }
  function awayEnd(){
    if(!S||!S.away) return;
    var a=S.away;S.away=null;clearTimeout(a.timer);clearInterval(a.poll);
    var ms=Date.now()-a.t;
    if(a.confirmed||ms>LEAVE_MIN){S.leaves.push({at:a.t,seconds:Math.max(2,Math.round(ms/1000))});log.push("leave:"+Math.round(ms/1000)+"s");}
  }
  function onBack(){if(!isAway()) awayEnd();}
  function post(p){
    if(!on) return Promise.reject(new Error("off"));
    if(typeof fetch!=="function") return Promise.reject(new Error("no fetch"));
    if(navigator.onLine===false) return Promise.reject(new Error("offline"));
    var req=fetch(CFG.url,{method:"POST",mode:"no-cors",cache:"no-store",keepalive:JSON.stringify(p).length<60000,
      headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(p)});
    var to=new Promise(function(_,rej){setTimeout(function(){rej(new Error("timeout"));},TIMEOUT);});
    return Promise.race([req,to]).then(function(){log.push("sent:"+qid(p));});
  }
  // page is going away: sendBeacon survives unload; fall back to fetch keepalive; queue if offline/refused
  function beacon(p){
    var body=JSON.stringify(p),ok=false;
    if(navigator.onLine===false){enqueue(p);return false;}
    try{if(navigator.sendBeacon) ok=navigator.sendBeacon(CFG.url,new Blob([body],{type:"text/plain;charset=UTF-8"}));}catch(e){ok=false;}
    if(ok){log.push("beacon:"+qid(p));return true;}
    try{fetch(CFG.url,{method:"POST",mode:"no-cors",keepalive:true,headers:{"Content-Type":"text/plain;charset=utf-8"},body:body})
      .then(function(){log.push("keepalive:"+qid(p));},function(){enqueue(p);});}catch(e){enqueue(p);}
    enqueue(p); // keepalive may die with the page; keep a copy (server de-dupes by session id)
    return false;
  }
  function flush(){
    if(!on||flushing) return Promise.resolve(0);
    var q=loadQ();if(!q.length) return Promise.resolve(0);
    try{var lk=+localStorage.getItem(QKEY+"_lock")||0;if(Date.now()-lk<10000){setTimeout(flush,10500);return Promise.resolve(0);}localStorage.setItem(QKEY+"_lock",String(Date.now()));}catch(e){}
    flushing=true;var n=0;log.push("flush:"+q.length);
    return q.reduce(function(chain,p){
      return chain.then(function(){if(!loadQ().some(function(x){return x&&qid(x)===qid(p);})) return;return post(p).then(function(){dequeue(p);n++;},function(){log.push("retry-failed:"+qid(p));});});
    },Promise.resolve()).then(function(){flushing=false;try{localStorage.removeItem(QKEY+"_lock");}catch(e){}return n;});
  }
  function abandon(why){ // send "incomplete" for an active session with >=1 answer (once per answer count)
    var k=S&&(S.answers.length+":"+S.leaves.length);
    if(!on||!S||S.done||!S.answers.some(function(x){return !x.extra;})||S.sentIncomplete===k) return null;
    S.sentIncomplete=k;
    var p=payload("incomplete");p.reason=why;window.__lastIncomplete=p;beacon(p);return p;
  }
  function init(o){o=o||{};meta={kid:clip(o.kid,40),topic:clip(o.topic||o.page,80),title:clip(o.title||o.page,120),subject:clip(o.subject,40),page:clip(o.page||o.title,160)};}
  function begin(o){if(!on) return;abandon("started something else");if(S){clearTimeout(S.away&&S.away.timer);clearInterval(S.away&&S.away.poll);}S=newSession(o);log.push("begin:"+S.id);}
  function answer(a){
    if(!on) return;
    a=a||{};if(!S||S.done) S=newSession({mode:a.mode});
    var k=(a.extra?"x:":"")+String(a.key!=null?a.key:a.q);if(S.keys[k]) return;S.keys[k]=1;
    var e={q:clip(a.q,160),given:clip(a.given==null||a.given===""?"(blank)":a.given,80),correct:clip(a.correct,200),ok:!!a.ok,skill:clip(a.skill,120)};
    if(a.extra){e.extra=true;if(a.warm)e.warm=true;}
    S.answers.push(e);
  }
  // end screen: builds the payload, adds a small status line into `card`, sends it (queues it if offline)
  function finish(r,card){
    if(!on) return null;
    var p;
    try{if(!S||S.done) S=newSession(r);awayEnd();S.done=true;p=payload("complete",r);}catch(e){log.push("build-error:"+e);return null;}
    window.__lastReport=p;
    var box=document.createElement("div");box.className="report-box";box.id="reportBox";
    box.style.cssText="margin-top:14px;font-size:18px;color:#5b6b7d;text-align:center;font-weight:normal";
    var st=document.createElement("div");st.id="reportStatus";st.textContent="Sending results to Dad…";box.appendChild(st);
    if(card) card.appendChild(box);
    saveQ(loadQ().filter(function(x){return x&&x.sessionId!==p.sessionId;}));
    post(p).then(function(){st.textContent="Results sent to Dad ✓";st.style.color="#2e8b57";flush();},
      function(e){enqueue(p);log.push("send-failed:"+(e&&e.message));
        st.textContent="No internet right now. Results saved; they'll go to Dad next time this page opens.";st.style.color="#b0641a";});
    return p;
  }
  if(on){
    try{localStorage.removeItem(OLDQ);}catch(e){}
    setTimeout(flush,1500);
    window.addEventListener("online",function(){flush();});
    window.addEventListener("pagehide",function(){abandon("page closed");});
    // hidden: start a possible leave AND send a provisional "incomplete" (server waits 10 min; coming back and
    // finishing supersedes it, and the complete report carries the final leave counts)
    document.addEventListener("visibilitychange",function(){if(document.visibilityState==="hidden"){awayStart();abandon("page hidden");}else onBack();});
    window.addEventListener("blur",function(){setTimeout(function(){if(isAway()) awayStart();},0);});
    window.addEventListener("focus",onBack);
  }
  window.__report={cfg:CFG,queue:loadQ,flush:flush,payload:function(s){return S&&payload(s||"incomplete");},session:function(){return S;},isAway:isAway,abandon:abandon,QKEY:QKEY};
  return {init:init,begin:begin,answer:answer,finish:finish,flush:flush,enabled:on};
})();

<script>// ---- Adaptive extra practice (shared by every practice page) ----
// A wrong FIRST try on a question queues 2 freshly generated questions on the same skill right after it. Extra
// questions keep coming (one at a time) until the kid gets 2 in a row right on that skill, capped at CAP per skill
// per session. Extra questions never change the main score; they are reported with extra:true.
// Weak skills (missed counts) are remembered in localStorage per page; the next session starts with a 3-question
// warm-up on the weakest skills.
//   var A=Adapt.create({page:"kmath", gens:{skill:function(){return item;}}, skillOf:function(item){return item.skill;},
//                       wrap:function(item){return listElement;}, unwrap:function(listElement){return item;}})
//   A.reset()                         new session
//   A.warmup(n)                       -> list elements for a warm-up (once per page load; [] if no weak skills)
//   A.answered(list,pos,item,ok,given)  call on the FIRST graded try of every question (original, extra or warm-up)
//   A.isExtra(el) / A.count(list) (originals only) / A.banner(item) / A.summary() / A.sayItem(item) / A.sayHint(item)
var Adapt=(function(){
  "use strict";
  var CAP=6,FIRST=2,STREAK=2,WARM=3,css=false;
  function addCss(){
    if(css) return;css=true;
    var s=document.createElement("style");
    s.textContent=".xp-banner{background:linear-gradient(90deg,#fff1c9,#ffe0ef);border:3px solid #f0a040;border-radius:16px;padding:8px 14px;margin:0 auto 10px;max-width:640px;font-size:21px;font-weight:bold;color:#8a4b00;text-align:center}"+
      ".xp-banner small{display:block;font-size:16px;font-weight:normal;color:#6b5a3a}.xp-banner.warm{background:linear-gradient(90deg,#dff7ff,#e9ffe6);border-color:#3bb0c9;color:#155e6e}"+
      ".xp-sum{margin:12px auto 0;max-width:560px;font-size:18px;background:#f4f8ff;border:2px dashed #9bb7d4;border-radius:14px;padding:8px 12px}.xp-sum b{color:#2a6fb0}";
    (document.head||document.body).appendChild(s);
  }
  function slug(s){return String(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,"").slice(0,60);}
  function ri(a,b){return a+Math.floor(Math.random()*(b-a+1));}
  function pick(a){return a[Math.floor(Math.random()*a.length)];}
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
  // multiple-choice helper: correct answer + distractors, unique, shuffled, correct always included
  function choices(ans,wrongs,n){
    var out=[String(ans)],i;n=n||3;
    for(i=0;i<wrongs.length&&out.length<n;i++){var w=String(wrongs[i]);if(out.indexOf(w)<0&&w!==""&&!/NaN|undefined|^-/.test(w))out.push(w);}
    return shuffle(out);
  }
  function valid(it){
    if(!it||it.ans==null||it.ans==="") return false;
    if(it.choices){var u={};for(var i=0;i<it.choices.length;i++){if(u[it.choices[i]])return false;u[it.choices[i]]=1;}
      if(!u[String(it.ans)]||it.choices.length<2)return false;}
    return typeof it.verify!=="function"||it.verify()===true;
  }
  var n=0;
  function create(o){
    addCss();
    var LS="adaptive_"+o.page+"_v1",gens=o.gens||{},skillOf=o.skillOf||function(it){return it.skill;};
    var wrap=o.wrap||function(x){return x;},unwrap=o.unwrap||function(x){return x;};
    var st={},tally={},order=[],warmDone=false,recent={},byKey={},last={list:null,pos:0};
    window.__adaptLog=window.__adaptLog||[];var log=window.__adaptLog;
    function load(){try{var x=JSON.parse(localStorage.getItem(LS)||"null");return x&&x.skills&&typeof x.skills==="object"?x:{skills:{}};}catch(e){return {skills:{}};}}
    function save(d){try{localStorage.setItem(LS,JSON.stringify(d));}catch(e){}}
    function note(skill,ok,extra){
      var d=load(),s=d.skills[skill]||{miss:0,t:0};
      // a miss adds 1; a right answer on extra/warm-up practice takes off 0.25 (originals answered right don't erase it),
      // so one miss + its 2 practice answers still leaves the skill on the list for next time's warm-up
      if(ok&&!extra) return;
      s.miss=ok?Math.max(0,s.miss-0.25):Math.min(20,s.miss+1);s.t=Date.now();
      if(s.miss<=0) delete d.skills[skill]; else d.skills[skill]=s;
      save(d);
    }
    function gen(skill,warm,ctx){
      var g=gens[skill];if(!g) return null;
      var seen=recent[skill]||(recent[skill]=[]),it=null,k;
      for(k=0;k<25;k++){
        var c=g(ctx||{});
        if(!valid(c)) continue;
        it=c;var sig=c.sig||(c.text||c.q||"")+"|"+c.ans+"|"+JSON.stringify(c.vis||c.p||"");
        if(seen.indexOf(sig)<0||k>20){seen.push(sig);if(seen.length>12)seen.shift();break;}
      }
      if(!it) return null;
      it.extra=true;it.warm=!!warm;it.skill=it.skill||skill;it.xskill=skill;
      it.key="x"+(++n)+"_"+slug(skill);it.id=it.id||it.key;byKey[it.key]=it;
      return it;
    }
    function S(skill){return st[skill]||(st[skill]={streak:0,made:0,active:false});}
    function pending(list,pos,skill){var c=0;for(var j=pos+1;j<list.length;j++){var it=unwrap(list[j]);if(it&&it.extra&&!it.warm&&it.xskill===skill)c++;}return c;}
    function drop(list,pos,skill){for(var j=list.length-1;j>pos;j--){var it=unwrap(list[j]);if(it&&it.extra&&!it.warm&&it.xskill===skill)list.splice(j,1);}}
    function lastPending(list,pos,skill){var at=pos;for(var j=pos+1;j<list.length;j++){var it=unwrap(list[j]);if(it&&it.extra&&!it.warm&&it.xskill===skill)at=j;}return at;}
    // test hook: ?noadapt in the URL turns extra practice + warm-ups off (lets the older fixed-sequence tests run unchanged)
    var OFF=/[?&]noadapt\b/.test(String(location.search||""));
    function answered(list,pos,item,ok,given,ctx){
      if(OFF) return 0;
      var skill=item.extra?item.xskill:skillOf(item);ok=!!ok;last={list:list,pos:pos};
      if(!skill||!gens[skill]) return 0;
      note(skill,ok,!!item.extra);
      if(item.extra){
        var t=tally[skill]||(tally[skill]={right:0,wrong:0});if(order.indexOf(skill)<0)order.push(skill);
        if(ok)t.right++;else t.wrong++;
        if(window.Report) Report.answer({key:item.key,q:(item.warm?"[Warm-up] ":"[Extra practice] ")+(item.reportQ||item.text||item.q||""),given:given,
          correct:item.reportAns||item.ans,ok:ok,skill:skill,extra:true,warm:!!item.warm});
      }
      var s=S(skill);
      if(ok){
        if(!s.active) return 0;
        s.streak++;
        if(s.streak>=STREAK){s.active=false;drop(list,pos,skill);log.push("done:"+skill);return 0;}
      }else{
        if(!s.active&&item.extra&&!item.warm&&s.made>=CAP) return 0;
        s.active=true;s.streak=0;
      }
      var need=(ok?STREAK-s.streak:Math.max(FIRST,STREAK))-pending(list,pos,skill);
      need=Math.min(need,CAP-s.made);
      var at=lastPending(list,pos,skill)+1,added=0;
      for(var i=0;i<need;i++){var it=gen(skill,false,ctx||item.ctx);if(!it)break;it.ctx=ctx||item.ctx;list.splice(at+added,0,wrap(it));added++;s.made++;}
      if(!added&&!pending(list,pos,skill)) s.active=false;
      log.push((ok?"right:":"wrong:")+skill+" +"+added);
      return added;
    }
    function weakest(){
      var d=load();return Object.keys(d.skills).filter(function(k){return gens[k];})
        .sort(function(a,b){return d.skills[b].miss-d.skills[a].miss||d.skills[b].t-d.skills[a].t;});
    }
    function warmup(cnt,ctx,filter){
      if(warmDone||OFF) return [];
      var w=weakest();if(filter) w=w.filter(filter);
      if(!w.length) return [];
      warmDone=true;cnt=cnt||WARM;var out=[],top=w.slice(0,cnt);
      for(var i=0;i<cnt;i++){var it=gen(top[i%top.length],true,ctx);if(it){it.ctx=ctx;out.push(wrap(it));}}
      log.push("warmup:"+out.length);
      return out;
    }
    function banner(item){
      var d=document.createElement("div");d.className="xp-banner"+(item.warm?" warm":"");d.id="xpBanner";
      d.innerHTML=item.warm?"🌅 Warm-up! Let's practice a tricky one from last time.<small>"+item.xskill+" · doesn't change your score</small>"
        :"🔁 Let's practice that again!<small>"+item.xskill+" · extra practice · doesn't change your score</small>";
      return d;
    }
    function summary(){return order.map(function(k){return {skill:k,right:tally[k].right,wrong:tally[k].wrong};});}
    function summaryEl(){
      var s=summary();if(!s.length) return null;
      var d=document.createElement("div");d.className="xp-sum";d.id="xpSummary";
      d.innerHTML="🔁 <b>Extra practice:</b> "+s.map(function(x){return x.skill+": "+x.right+" right"+(x.wrong?", "+x.wrong+" to work on":"");}).join(" · ");
      return d;
    }
    // voice: pre-recorded generic prompt clips ("xs_<slug of item.say>", recorded per skill by make_audio_adaptive.py)
    // + the specific numbers/words (item.speak) via speechSynthesis. intro=true adds "Let's practice that again!".
    function sayItem(item,intro){
      if(!window.Voice) return;
      var seq=[];
      if(intro&&item.extra){var bk=item.warm?"xa_warm":"xa_again";if(Voice.has(bk))seq.push({k:bk,gap:200});}
      if(item.clips) seq=seq.concat(item.clips);
      else{
        if(item.say){var k="xs_"+slug(item.say);seq.push(Voice.has(k)?{k:k,gap:150}:{t:item.say});}
        if(item.speak) seq.push({t:item.speak});
      }
      if(seq.length) Voice.play(seq);
    }
    function sayHint(item,pre){if(!window.Voice) return;var seq=pre?[].concat(pre):[];if(item.hintSay||item.hint) seq.push({t:String(item.hintSay||item.hint).replace(/[★✓]/g,"")});Voice.play(seq);}
    function reset(){st={};tally={};order=[];}
    function isExtra(el){var it=unwrap(el);return !!(it&&it.extra);}
    function count(list){return list.filter(function(x){return !isExtra(x);}).length;}
    function done(list,pos){var c=0;for(var j=0;j<pos&&j<list.length;j++) if(!isExtra(list[j]))c++;return c;}
    return {answered:answered,warmup:warmup,banner:banner,summary:summary,summaryEl:summaryEl,sayItem:sayItem,sayHint:sayHint,reset:reset,
      isExtra:isExtra,count:count,done:done,gen:gen,gens:gens,weakest:weakest,load:load,LS:LS,slug:slug,
      state:function(){return {st:st,tally:tally};},item:function(k){return byKey[k];},
      peek:function(){return last.list?{pos:last.pos,list:last.list.map(function(x){var it=unwrap(x);return it&&it.extra?{extra:true,warm:!!it.warm,skill:it.xskill,key:it.key}:{extra:false,skill:skillOf(it)};})}:null;},clear:function(){try{localStorage.removeItem(LS);}catch(e){}}};
  }
  return {create:create,ri:ri,pick:pick,shuffle:shuffle,choices:choices,slug:slug,CAP:CAP};
})();

<script>
(function(){
"use strict";
// ---------- Skill how-tos (from the study guide) ----------
var SKILLS={
1:"Multiplication facts",2:"Factors and factor pairs",3:"Rounding to the nearest thousand",4:"Comparing and ordering big numbers",
5:"Adding and subtracting big numbers",6:"Multiplying in parts (distributive property)",7:"Division with remainders",
8:"“Times as many” number sentences",9:"Place value",10:"Equivalent fractions and comparing fractions",
11:"Unit conversions (length and money)",12:"Geometry words and perimeter",13:"Word problems"};

// ---------- Answer normalizing ----------
// Removes commas, spaces, $ and unit words ("ft", "inches", "boxes", "quarters"...), then reads the number.
function toNum(s){
  if(s==null) return NaN;
  s=String(s).toLowerCase().replace(/[\u00a0\s,$]/g,"");
  s=s.replace(/^(about|=)+/,"");
  s=s.replace(/[a-z°'".]+$/,"");      // trailing units: ft, in., inches, boxes, °, lb ...
  s=s.replace(/^[a-z]+(?=\d)/,"");     // leading word, e.g. "is72" (rare)
  if(!/^-?\d+(\.\d+)?$/.test(s)) return NaN;
  return parseFloat(s);
}
function ints(s){ return (String(s).replace(/(\d),(?=\d{3}\b)/g,"$1").match(/\d+/g)||[]).map(Number); }
function factorPairs(n){var p=[];for(var a=1;a*a<=n;a++) if(n%a===0) p.push([a,n/a]);return p;}
function checkPairs(s,n){
  var nums=ints(s); if(!nums.length) return false;
  var want=factorPairs(n), wantKeys=want.map(function(p){return p[0]+"x"+p[1];}).sort().join("|");
  // a) typed as pairs: 1x12, 2x6, 3x4 (any order, either way round)
  if(nums.length%2===0){
    var keys={},bad=false;
    for(var i=0;i<nums.length;i+=2){var a=nums[i],b=nums[i+1];if(a*b!==n){bad=true;break;}keys[Math.min(a,b)+"x"+Math.max(a,b)]=1;}
    if(!bad && Object.keys(keys).sort().join("|")===wantKeys && nums.length===want.length*2) return true;
  }
  // b) typed as a list of all the factors: 1, 2, 3, 4, 6, 12
  var allF=[];want.forEach(function(p){allF.push(p[0]);if(p[1]!==p[0])allF.push(p[1]);});
  var u=nums.slice().sort(function(x,y){return x-y;}).filter(function(v,i,a){return i===0||a[i-1]!==v;});
  return u.length===nums.length && u.join(",")===allF.sort(function(x,y){return x-y;}).join(",");
}
function num(ans,o){o=o||{};o.type="num";o.ok=function(v){var x=toNum(v);return !isNaN(x)&&[].concat(ans).indexOf(x)>=0;};return o;}
function pick(options,ans,o){o=o||{};o.type="choice";o.options=options;o.ok=function(v){return v===ans;};return o;}
function pairs(n,o){o=o||{};o.type="text";o.ok=function(v){return checkPairs(v,n);};return o;}

// fraction bar picture for #19
function bar(parts,shaded,w,y){var s="",pw=w/parts;for(var i=0;i<parts;i++)s+='<rect x="'+(4+i*pw)+'" y="'+y+'" width="'+pw+'" height="34" fill="'+(i<shaded?"#f2a33a":"#fff")+'" stroke="#334" stroke-width="2"/>';return s;}
function model(a,b,c,d,w2){w2=w2||300;return '<svg viewBox="0 0 310 86" width="310" height="86" aria-hidden="true">'+bar(a,b,300,4)+bar(c,d,w2,48)+'</svg>';}

// ---------- The 25 practice-test problems ----------
var Q=[
{n:1,s:1,q:"8 × 9 = ?",f:[num(72)],
 hint:"Trick for 9s: hold up 10 fingers and fold down finger number 8. Count the fingers on the left (tens) and on the right (ones).",ans:"72"},
{n:2,s:2,q:"In 4 × 7 = 28, which numbers are the factors, and which number is the product?",
 f:[{type:"num",pre:"Factors:",cls:"small"},{type:"num",pre:"and",cls:"small"},{type:"num",pre:"Product:",cls:"small",row:true}],
 check:function(v){var a=toNum(v[0]),b=toNum(v[1]),p=toNum(v[2]);var fa=(a===4&&b===7)||(a===7&&b===4);return [fa,fa,p===28];},
 hint:"The numbers you multiply are the factors. The answer you get is the product.\nIn 2 × 3 = 6, the factors are 2 and 3, and the product is 6.",ans:"Factors: 4 and 7. Product: 28."},
{n:3,s:2,q:"List all the factor pairs for 12.",f:[pairs(12,{cls:"wide",ph:"like: 1 x 12, 2 x …"})],tip:"Type each pair, like 1 x 12, 2 x 6 … (or list all the factors).",
 hint:"Start with 1 × 12. Then try 2, 3, 4 … Does it go in exactly? Stop when the pairs start to repeat.",ans:"1 × 12, 2 × 6, 3 × 4"},

  var card=el("div","card");card.id="qcard";
  if(q.extra){card.dataset.extra=q.warm?"warm":"1";card.appendChild(A.banner(q));}
  card.appendChild(el("span","qnum",q.extra?"★":"#"+q.n));
  card.appendChild(el("span","skill","Skill "+q.s+": "+SKILLS[q.s]));
  card.appendChild(el("div","qtext",q.q));
  var fw=el("div","fields");inputs=[];
  q.f.forEach(function(f,fi){
    var w=el("div","field"+(f.row?" row":""));
    if(f.pre) w.appendChild(el("span",null,f.pre));
    if(f.type==="choice"){
      var box=el("div","choices"+(f.vert?" vert":""));var val=null;var bs=[];
      f.options.forEach(function(o,oi){
        var b=el("button","ch"+(f.sym?" sym":""),f.labels?f.labels[oi]:o);b.type="button";b.setAttribute("data-val",o);
        b.addEventListener("click",function(){if(state.done)return;val=o;bs.forEach(function(x){x.classList.remove("sel","bad");});b.classList.add("sel");});
        bs.push(b);box.appendChild(b);
      });
      w.appendChild(box);if(f.vert||f.labels) w.classList.add("row");
      inputs.push({get:function(){return val;},mark:function(ok){bs.forEach(function(x){x.classList.remove("ok","bad");if(x.getAttribute("data-val")===val&&val!=null)x.classList.add(ok?"ok":"bad");});},focus:function(){}});
    }else{
      var inp=el("input","ans"+(f.cls?" "+f.cls:""));
      inp.type="text";inp.setAttribute("autocomplete","off");inp.setAttribute("autocorrect","off");inp.setAttribute("autocapitalize","off");inp.spellcheck=false;
      if(f.type==="num") inp.setAttribute("inputmode","decimal");
      if(f.ph) inp.placeholder=f.ph;
      inp.setAttribute("aria-label","answer "+(fi+1));
      inp.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();if(!state.done)doCheck();else next();}});
      inp.addEventListener("input",function(){inp.classList.remove("bad");});
      w.appendChild(inp);
      inputs.push({get:function(){return inp.value;},mark:function(ok){inp.classList.remove("ok","bad");inp.classList.add(ok?"ok":"bad");if(ok)inp.readOnly=state.done;},focus:function(){inp.focus();},inp:inp});
    }
    if(f.post) w.appendChild(el("span",null,f.post));
    fw.appendChild(w);
  });
  card.appendChild(fw);
  if(q.tip) card.appendChild(el("div","tip",q.tip));
  var fb=el("div","feedback");fb.id="fb";card.appendChild(fb);
  var btns=el("div","btns");
  var cb=el("button","big check","✔ Check");cb.type="button";cb.id="checkBtn";cb.addEventListener("click",doCheck);
  var sb=el("button","big show","👀 Show answer");sb.type="button";sb.id="showBtn";sb.style.display="none";sb.addEventListener("click",reveal);
  var nb=el("button","big next",(state.pos+1>=state.order.length?"Finish 🏁":"Next ➜"));nb.type="button";nb.id="nextBtn";nb.style.display="none";nb.addEventListener("click",next);
  btns.appendChild(cb);btns.appendChild(sb);btns.appendChild(nb);card.appendChild(btns);
  main.appendChild(card);
  // focus the first text box on laptops (not on touch screens, to avoid the keyboard jumping up)
  if(!("ontouchstart" in window)&&inputs[0]&&inputs[0].inp) inputs[0].focus();
  window.scrollTo(0,0);
}

function doCheck(){
  if(state.done) return;
  var q=Q[state.order[state.pos]];
  var vals=inputs.map(function(i){return i.get();});
  var fb=document.getElementById("fb");
  if(vals.some(function(v){return v==null||String(v).trim()==="";})){
    fb.className="feedback wrong";fb.innerHTML="<b class='t'>✏️ Fill in every answer first.</b>";return;
  }
  var res=q.check?q.check(vals):q.f.map(function(f,i){return f.ok(vals[i]);});
  var allOk=res.every(Boolean);
  state.tries++;
  if(!q.extra) Report.answer({key:q.n,q:"#"+q.n+": "+q.q,given:typedText(q,vals),correct:q.ans,ok:allOk&&!state.revealed,skill:"Skill "+q.s+": "+SKILLS[q.s]});
  if(!q._graded){q._graded=true;A.answered(state.order,state.pos,q,allOk&&!state.revealed,typedText(q,vals));}
  if(allOk){
    state.done=true;
    if(state.tries===1&&!state.revealed&&!q.extra){state.score++;}
    res.forEach(function(r,i){inputs[i].mark(true);});
    var praise=["Awesome!","You got it!","Great job!","Super!","Nailed it!","Math star!"][Math.floor(Math.random()*6)];
    fb.className="feedback right";
    fb.innerHTML="<b class='t'>✅ "+praise+"</b>"+(state.tries>1?(q.extra?"Nice fixing!":"Nice fixing! (This one counts as a miss, so you can practice it again.)"):"");
    celebrate();
    document.getElementById("checkBtn").style.display="none";document.getElementById("showBtn").style.display="none";
    document.getElementById("nextBtn").style.display="";
    updateTop();
  }else{
    if(state.tries===1&&!q.extra){markMissed(q.n);if(state.typed[q.n]==null) state.typed[q.n]=typedText(q,vals);}
    res.forEach(function(r,i){inputs[i].mark(r);});
    fb.className="feedback wrong";
    fb.innerHTML="<b class='t'>🤔 Not quite. Try again!</b><div class='hint'><b>Hint:</b> "+q.hint+"</div>";
    var c=document.getElementById("qcard");c.classList.remove("shake");void c.offsetWidth;c.classList.add("shake");
    document.getElementById("showBtn").style.display="";
    document.getElementById("nextBtn").style.display="";
  }
}
// what Eli entered on his first (wrong) try, e.g. "Factors: 4; and 7; Product: 27"
function typedText(q,vals){
  return vals.map(function(v,i){var f=q.f[i]||{};return (vals.length>1&&f.pre?f.pre+" ":"")+String(v==null?"":v).trim()+(f.post&&vals.length>1?(f.post.charAt(0)==="/"?"":" ")+f.post:"");}).join("; ");
}
function markMissed(n){if(state.missed.indexOf(n)<0)state.missed.push(n);}
function reveal(){
  var q=Q[state.order[state.pos]];state.revealed=true;
  if(q.extra){if(!q._graded){q._graded=true;A.answered(state.order,state.pos,q,false,"(tapped Show answer)");}}
  else{markMissed(q.n);Report.answer({key:q.n,q:"#"+q.n+": "+q.q,given:"(tapped Show answer)",correct:q.ans,ok:false,skill:"Skill "+q.s+": "+SKILLS[q.s]});}
  var fb=document.getElementById("fb");
  if(!fb.querySelector(".answer")) fb.insertAdjacentHTML("beforeend","<span class='answer'><b>Answer:</b> "+q.ans+"</span>");
  fb.className="feedback wrong";
  document.getElementById("nextBtn").style.display="";
}
function next(){
  var q=Q[state.order[state.pos]];
  if(!state.done&&q.extra){if(!q._graded){q._graded=true;A.answered(state.order,state.pos,q,false,"(skipped)");}}
  else if(!state.done){markMissed(q.n);if(state.typed[q.n]==null) state.typed[q.n]="(skipped)";Report.answer({key:q.n,q:"#"+q.n+": "+q.q,given:"(skipped)",correct:q.ans,ok:false,skill:"Skill "+q.s+": "+SKILLS[q.s]});} // skipped or not solved
  state.pos++;render();
}
function renderEnd(){
  var total=A.count(state.order),s=state.score;
  document.getElementById("bar").style.width="100%";
  var pct=s/total,stars=pct===1?"⭐⭐⭐":pct>=.8?"⭐⭐":pct>=.5?"⭐":"💪";
  var card=el("div","card end");card.id="endCard";
  card.innerHTML="<div class='stars'>"+stars+"</div><h2 style='margin:4px 0'>"+(state.round>1?"Redo round done!":"Practice test done!")+"</h2>"+
   "<div class='score' id='finalScore'>"+s+" / "+total+"</div>"+
   "<div>"+(pct===1?"Perfect! Every one right on the first try! 🎉":pct>=.8?"Great work! Just a few to practice.":"Good effort! Let's practice the ones you missed.")+"</div>";
  var missed=state.missed.slice().sort(function(a,b){return a-b;});
  if(missed.length){
    card.appendChild(el("div",null,"<br>Problems to practice:"));
    var ch=el("div","chips");missed.forEach(function(n){ch.appendChild(el("span","chip","#"+n+" · "+SKILLS[Q[n-1].s]));});card.appendChild(ch);
  }
  var xs=A.summaryEl();if(xs)card.appendChild(xs);
  var btns=el("div","btns");btns.style.justifyContent="center";
  if(missed.length){var t=el("button","big check","🔁 Try missed ones again");t.type="button";t.id="retryBtn";
    t.addEventListener("click",function(){fresh(missed.map(function(n){return n-1;}),state.round+1);});btns.appendChild(t);}
  var r=el("button","big restart","↺ Start over (all 25)");r.type="button";r.addEventListener("click",function(){fresh(all(),1);});btns.appendChild(r);
  card.appendChild(btns);main.appendChild(card);
  Report.finish({mode:"Math Practice Test #5",round:state.round,score:s,total:total,startedAt:state.t0,
    missed:missed.map(function(n){var q=Q[n-1];return {item:"#"+n+": "+q.q,typed:state.typed[n]||"",correct:q.ans,skill:"Skill "+q.s+": "+SKILLS[q.s]};})},card);
  if(pct>=.8) {celebrate();setTimeout(celebrate,350);}
}
function celebrate(){
  var icons=["⭐","🌟","✨","🎉","💫"];var cx=window.innerWidth/2,cy=window.innerHeight/2.5;
  for(var i=0;i<16;i++){var s=el("span","burst",icons[i%icons.length]);var a=Math.random()*Math.PI*2,d=120+Math.random()*200;
    s.style.left=cx+"px";s.style.top=cy+"px";s.style.setProperty("--dx",Math.cos(a)*d+"px");s.style.setProperty("--dy",Math.sin(a)*d+"px");
    document.body.appendChild(s);(function(x){setTimeout(function(){x.remove();},1100);})(s);}
}
document.getElementById("startOver").addEventListener("click",function(){if(state.pos===0||confirm("Start over from problem #1?"))fresh(all(),1);});
// expose for testing
window.__practice={Q:Q,toNum:toNum,checkPairs:checkPairs,state:function(){return state;},A:A,fresh:fresh,all:all};
fresh(all(),1);
})();
</script>
